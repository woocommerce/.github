name: 'WordPress Plugin Checks'

# WordPress Plugin Check on the verified production ZIP, with config.woo.pluginCheck.
#
#   plugin-check:
#     needs: build
#     permissions:
#       contents: read
#       actions: read
#     uses: woocommerce/.github/.github/workflows/plugin-check.yml@<commit SHA>
#     with:
#       artifact-id: ${{ needs.build.outputs.artifact-id }}
#       source-sha: ${{ needs.build.outputs.source-sha }}
#       expected-source-sha: ${{ github.sha }}
#       sha256: ${{ needs.build.outputs.sha256 }}

on:
  workflow_call:
    inputs:
      # Optional normalized config.woo from github.sha, provided by the PR CI planner.
      event-config:
        type: string
        default: ''
      artifact-id:
        type: string
        required: true
      source-sha:
        type: string
        required: true
      expected-source-sha:
        type: string
        required: true
      sha256:
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  # config.woo.pluginCheck of the candidate's commit.
  config:
    name: Read plugin metadata
    if: inputs.event-config == '' || inputs.source-sha != github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      json: ${{ steps.config.outputs.json }}
    steps:
      - name: Read config.woo
        id: config
        uses: $/actions/read-plugin-config
        with:
          ref: ${{ inputs.source-sha }}

  test:
    needs: config
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.config.result == 'skipped' && inputs.event-config || needs.config.outputs.json).pluginCheck.timeoutMinutes }}
    steps:
      - name: Verify and unpack the production ZIP
        id: candidate
        uses: $/actions/verify-candidate-zip
        with:
          artifact-id: ${{ inputs.artifact-id }}
          source-sha: ${{ inputs.source-sha }}
          expected-source-sha: ${{ inputs.expected-source-sha }}
          sha256: ${{ inputs.sha256 }}
          zip-name: ${{ fromJSON(needs.config.result == 'skipped' && inputs.event-config || needs.config.outputs.json).slug }}.zip
          destination: release-build
          root: ${{ fromJSON(needs.config.result == 'skipped' && inputs.event-config || needs.config.outputs.json).zip.root }}
          main-file: ${{ fromJSON(needs.config.result == 'skipped' && inputs.event-config || needs.config.outputs.json).mainFile }}

      # Plugin Check falls back to the workspace root when build-dir is empty.
      - name: Require the unpacked candidate
        env:
          PLUGIN_DIR: ${{ steps.candidate.outputs.plugin-dir }}
        run: test -n "$PLUGIN_DIR" && test -d "$PLUGIN_DIR"

      - name: Run plugin check
        uses: wordpress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: ${{ steps.candidate.outputs.plugin-dir }}
          repo-token: ''
          exclude-checks: ${{ join(fromJSON(needs.config.result == 'skipped' && inputs.event-config || needs.config.outputs.json).pluginCheck.excludeChecks, fromJSON('"\n"')) }}
          exclude-directories: ${{ join(fromJSON(needs.config.result == 'skipped' && inputs.event-config || needs.config.outputs.json).pluginCheck.excludeDirectories, fromJSON('"\n"')) }}
          exclude-files: ${{ join(fromJSON(needs.config.result == 'skipped' && inputs.event-config || needs.config.outputs.json).pluginCheck.excludeFiles, fromJSON('"\n"')) }}
          ignore-warnings: ${{ fromJSON(needs.config.result == 'skipped' && inputs.event-config || needs.config.outputs.json).pluginCheck.ignoreWarnings }}
          strict: ${{ fromJSON(needs.config.result == 'skipped' && inputs.event-config || needs.config.outputs.json).pluginCheck.strict }}
          # Plugin Check has no baseline support: config.woo.pluginCheck.ignoreCodes lists legacy
          # codes with pre-existing hits that the repository's own PHPCS gate tracks.
          ignore-codes: ${{ join(fromJSON(needs.config.result == 'skipped' && inputs.event-config || needs.config.outputs.json).pluginCheck.ignoreCodes, fromJSON('"\n"')) }}
