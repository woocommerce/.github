name: Cron CI

# The plugin's weekly checks: lint, PHPStan, PHPUnit and the integration suite on the scheduled
# versions (config.woo.phpunit.scheduledWc), the production ZIP, Plugin Check, E2E, QIT on the
# stable versions and the dependency advisory check, with a Slack message for the outcome. The
# caller keeps the schedule.
#
#   cron:
#     name: Cron
#     permissions:
#       contents: read
#       actions: read
#       vulnerability-alerts: read
#     uses: woocommerce/.github/.github/workflows/plugin-cron-ci.yml@<commit SHA>
#     with:
#       slack-channel: '#team-ci'
#     secrets:
#       ORG_DOWNLOADS: ${{ secrets.ORG_DOWNLOADS }}
#       ORG_PARTNER_USER: ${{ secrets.ORG_PARTNER_USER }}
#       ORG_PARTNER_SECRET: ${{ secrets.ORG_PARTNER_SECRET }}
#       SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

on:
  workflow_call:
    inputs:
      slack-channel:
        description: Slack destination. Leave blank to skip notifications.
        type: string
        required: false
      # Enable the private QIT action from a private WooCommerce repository.
      use-qit-action:
        type: boolean
        default: false
    secrets:
      # Private plugin downloads (PHPStan stubs, PHPUnit, E2E). Fork pull requests never receive it.
      ORG_DOWNLOADS:
        required: false
      # QIT partner credentials.
      ORG_PARTNER_USER:
        required: false
      ORG_PARTNER_SECRET:
        required: false
      # Slack webhook for callers that set slack-channel.
      SLACK_WEBHOOK_URL:
        required: false

permissions:
  contents: read

jobs:

    config:
        name: Read plugin metadata
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
          json: ${{ steps.config.outputs.json }}
        steps:
          - name: Read config.woo
            id: config
            uses: $/actions/read-plugin-config

    php-lint:
        name: PHP
        uses: ./.github/workflows/plugin-php-lint.yml

    phpstan:
        name: PHPStan
        uses: ./.github/workflows/plugin-phpstan.yml
        secrets:
          ORG_DOWNLOADS: ${{ secrets.ORG_DOWNLOADS }}

    js-lint:
        if: ${{ fromJSON(needs.config.outputs.json).capabilities.js }}
        name: JS Linting
        needs: config
        uses: ./.github/workflows/plugin-js-lint.yml

    # config.woo.phpunit.scheduledWc (for example `trunk`) replaces the WooCommerce version here,
    # so a core change that breaks the plugin shows up before it ships.
    php-tests:
        if: ${{ !failure() && !cancelled() && fromJSON(needs.config.outputs.json).capabilities.phpunit }}
        name: PHP
        needs: [config, php-lint, js-lint]
        uses: ./.github/workflows/plugin-phpunit.yml
        with:
          wc-version: ${{ fromJSON(needs.config.outputs.json).phpunit.scheduledWc }}
          trusted-plugins: true
          scheduled: true
        secrets:
          ORG_DOWNLOADS: ${{ secrets.ORG_DOWNLOADS }}

    integration-tests:
        if: ${{ !failure() && !cancelled() && fromJSON(needs.config.outputs.json).capabilities.integration }}
        name: PHP integration
        needs: [config, php-lint, js-lint]
        uses: ./.github/workflows/plugin-phpunit.yml
        with:
          suite: integration
          trusted-plugins: true
          scheduled: true
        secrets:
          ORG_DOWNLOADS: ${{ secrets.ORG_DOWNLOADS }}

    build_project:
        if: ${{ !failure() && !cancelled() }}
        name: Package
        needs: [config, php-tests, integration-tests]
        uses: ./.github/workflows/plugin-build-zip.yml
        with:
          qit-derivative: ${{ fromJSON(needs.config.outputs.json).capabilities.qit }}

    # The jobs below need the package, which runs after PHPUnit and the integration suite with
    # `!failure() && !cancelled()`. A plain `if:` also checks every job further up, so a skipped
    # integration suite or JavaScript lint would skip them; these keep the same guard.
    plugin-check:
        if: ${{ !failure() && !cancelled() && fromJSON(needs.config.outputs.json).capabilities.pluginCheck }}
        name: Plugin Check
        needs: [config, build_project]
        permissions:
          contents: read
          actions: read
        uses: ./.github/workflows/plugin-check.yml
        with:
          artifact-id: ${{ needs.build_project.outputs.artifact-id }}
          source-sha: ${{ needs.build_project.outputs.source-sha }}
          expected-source-sha: ${{ github.sha }}
          sha256: ${{ needs.build_project.outputs.sha256 }}

    e2e-tests:
        if: ${{ !failure() && !cancelled() && fromJSON(needs.config.outputs.json).capabilities.e2e }}
        name: E2E tests
        needs: [config, build_project]
        permissions:
          contents: read
          actions: read
        uses: ./.github/workflows/plugin-e2e.yml
        with:
          artifact-id: ${{ needs.build_project.outputs.artifact-id }}
          source-sha: ${{ needs.build_project.outputs.source-sha }}
          sha256: ${{ needs.build_project.outputs.sha256 }}
          trusted-plugins: true
        secrets:
          ORG_DOWNLOADS: ${{ secrets.ORG_DOWNLOADS }}

    qit-tests:
        if: ${{ !failure() && !cancelled() && fromJSON(needs.config.outputs.json).capabilities.qit }}
        name: QIT tests
        needs: [config, build_project]
        uses: ./.github/workflows/plugin-qit.yml
        secrets:
          ORG_PARTNER_USER: ${{ secrets.ORG_PARTNER_USER }}
          ORG_PARTNER_SECRET: ${{ secrets.ORG_PARTNER_SECRET }}
        with:
          extension: ${{ fromJSON(needs.config.outputs.json).qit.extension }}
          use-qit-action: ${{ inputs.use-qit-action }}
          plugins: ${{ fromJSON(needs.config.outputs.json).qit.plugins }}
          artifact: 'acceptance-test-zip'
          derivative: ${{ fromJSON(needs.config.outputs.json).qit.derivativeExclude != '' && 'qit-derivative' || '' }}
          timeout-minutes: ${{ fromJSON(needs.config.outputs.json).qit.timeoutMinutes }}
          test-activation: ${{ 'true' }}
          test-security: ${{ 'true' }}
          test-phpcompatibility: ${{ 'true' }}
          test-validation: ${{ 'true' }}
          test-phpstan: ${{ 'false' }} # QIT PHPStan uses its own config (no repo bootstrap/baseline); the repo's PHPStan (the shared plugin-phpstan.yml) is the gate.
          test-woo-api: ${{ 'true' }}
          test-woo-e2e: ${{ 'true' }}

    audit:
        name: Dependency advisories
        permissions:
            vulnerability-alerts: read
        uses: ./.github/workflows/plugin-audit.yml

    handle-success:
        if: ${{ !failure() && !cancelled() }}
        needs: [phpstan, plugin-check, e2e-tests, qit-tests, audit]
        name: Handle success
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions: {}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        steps:
          - uses: $/actions/notify-slack
            with:
                slack-channel: ${{ inputs.slack-channel }}
                status: success
                message: "Scheduled workflow <{{workflowUrl}}|{{workflow}}> with run ID <{{workflowRunUrl}}|{{runId}}> passed."

    handle-cancelled:
        if: ${{ cancelled() }}
        needs: [phpstan, plugin-check, e2e-tests, qit-tests, audit]
        name: Handle cancellation
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions: {}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        steps:
          - uses: $/actions/notify-slack
            with:
                slack-channel: ${{ inputs.slack-channel }}
                status: cancelled
                message: "Scheduled workflow <{{workflowUrl}}|{{workflow}}> with run ID <{{workflowRunUrl}}|{{runId}}> cancelled."

    handle-error:
        if: ${{ failure() }}
        needs: [phpstan, plugin-check, e2e-tests, qit-tests, audit]
        name: Handle failure
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions: {}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        steps:
          - uses: $/actions/notify-slack
            with:
                slack-channel: ${{ inputs.slack-channel }}
                status: failure
                message: "Scheduled workflow <{{workflowUrl}}|{{workflow}}> with run ID <{{workflowRunUrl}}|{{runId}}> failed."
