name: Read plugin config
description: Check out the plugin's package.json and config reader at a ref, and output package.json config.woo with every default applied, as JSON.

# Example, in a job whose outputs other jobs read:
#
#   config:
#     runs-on: ubuntu-latest
#     outputs:
#       json: ${{ steps.config.outputs.json }}
#     steps:
#       - id: config
#         uses: woocommerce/.github/actions/read-plugin-config@<commit SHA>
#
# The plugin provides the reader, bin/woo-config.sh, and its schema, bin/woo-config.schema.json.
# Developers run the same reader locally.

inputs:
  ref:
    description: Ref to read the config from. Empty reads the commit the workflow runs on.
    required: false
    default: ''

outputs:
  json:
    description: The normalized config.woo object.
    value: ${{ steps.config.outputs.json }}

runs:
  using: composite
  steps:
    - name: Check out the package metadata
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref }}
        persist-credentials: false
        sparse-checkout: |
          package.json
          bin/woo-config.sh
          bin/woo-config.schema.json
        sparse-checkout-cone-mode: false

    - name: Read config.woo
      id: config
      shell: bash
      run: bash bin/woo-config.sh --github-output
