name: AI Code Review (Reusable)

on:
  workflow_call:
    inputs:
      model:
        description: 'Claude model to use'
        required: false
        type: string
        default: 'claude-opus-4-6'
      timeout_minutes:
        description: 'Timeout for the review job'
        required: false
        type: number
        default: 30
    secrets:
      AI_CODE_REVIEW_ANTHROPIC_API_KEY:
        required: true

jobs:
  # Caller-org guard. Reject callers outside the allowed orgs before any
  # further job runs.
  #
  # Why this is safe: github.repository_owner and github.repository are
  # populated by the runner from the triggering event of the caller's
  # workflow run. They are not user-writable; caller inputs, env, secrets,
  # and matrix values live in separate contexts (inputs.*, env.*, secrets.*,
  # matrix.*) that do not feed into github.*.
  #
  # Edge cases:
  # - Fork opening a PR back (e.g. eve/woocommerce-bookings into
  #   woocommerce/woocommerce-bookings): pull_request and pull_request_target
  #   events are delivered to the BASE repo, so github.repository_owner is
  #   "woocommerce" and the guard passes. Fork PRs are then excluded at the
  #   ai-review job's same-repo if: condition
  #   (github.event.pull_request.head.repo.full_name == github.repository).
  # - External fork of this workflow file (uses: evil/.github/...) runs
  #   independently in that org's context and does not invoke this repo.
  #
  # Docs:
  # - Contexts reference: https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/accessing-contextual-information-about-workflow-runs
  # - Reusing workflows: https://docs.github.com/en/actions/sharing-automations/reusing-workflows
  # - Pull request events on forks: https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows#pull_request_target
  guard:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Reject callers outside allowed orgs
        run: |
          case "$CALLER_OWNER" in
            woocommerce|mailpoet) ;;
            *) echo "Caller $CALLER_REPO is not allowed." >&2; exit 1 ;;
          esac
        env:
          CALLER_OWNER: ${{ github.repository_owner }}
          CALLER_REPO: ${{ github.repository }}

  ai-review:
    needs: guard
    if: |
      (github.repository_owner == 'woocommerce' || github.repository_owner == 'mailpoet') &&
      (
        (github.event_name == 'pull_request' &&
         github.event.action != 'synchronize' &&
         github.event.pull_request.draft == false &&
         github.event.pull_request.head.repo != null &&
         github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'issue_comment' &&
         github.event.issue.pull_request != null &&
         github.event.issue.state == 'open')
      )
    concurrency:
      # Per-event namespace so a comment trigger does not cancel an in-flight first review.
      group: ai-review-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes || 30 }}
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      # Gate issue_comment runs to PR comments matching the bot trigger.
      # COMMENT_BODY is event metadata, safe to grep here.
      - name: Validate trigger
        id: trigger
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_PR_COMMENT: ${{ github.event.issue.pull_request != null }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            if [ "$IS_PR_COMMENT" != "true" ]; then
              echo "Comment is on an issue, not a PR; skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Accept `@claude review` and `@claude /review` (line-anchored, optional trailing punctuation).
            CLEAN_BODY=${COMMENT_BODY//$'\r'/}
            if ! printf '%s\n' "$CLEAN_BODY" | grep -qiE '^[[:space:]]*@claude[[:space:]]+/?review([[:space:]]|[[:punct:]]|$)'; then
              echo "Comment did not match @claude review or @claude /review trigger; skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # Fork reject. issue_comment payloads lack head.repo, so look it up.
      - name: Reject fork PRs
        if: steps.trigger.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          if [ -n "$PR_HEAD_REPO" ]; then
            HEAD_REPO="$PR_HEAD_REPO"
          else
            HEAD_REPO=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --json headRepositoryOwner,headRepository \
              --jq 'if .headRepository == null or .headRepositoryOwner == null
                    then "DELETED-OR-UNKNOWN"
                    else "\(.headRepositoryOwner.login)/\(.headRepository.name)" end')
          fi
          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::Fork PR rejected. Head repo: $HEAD_REPO, base: $GITHUB_REPOSITORY."
            exit 1
          fi

      # PR author and (on issue_comment) comment sender must both have admin|write.
      # Permission API returns admin|write|read|none.
      # https://docs.github.com/en/rest/collaborators/collaborators#get-repository-permissions-for-a-user
      - name: Check write access
        id: check-team
        if: steps.trigger.outputs.skip != 'true'
        run: |
          set -euo pipefail
          : "${PR_AUTHOR:?PR_AUTHOR is empty; refusing to query collaborators with empty login}"

          if [[ "$PR_AUTHOR_TYPE" == "Bot" ]]; then
            echo "Author $PR_AUTHOR is a Bot; denying review."
            echo "is_member=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PR_PERM=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${PR_AUTHOR}/permission" --jq '.permission' 2>"${RUNNER_TEMP}/gh.err" || echo "none")
          PR_PERM=${PR_PERM:-none}
          case "$PR_PERM" in
            admin|write) ;;
            *)
              echo "Author $PR_AUTHOR has permission=$PR_PERM; denying review."
              [ -s "${RUNNER_TEMP}/gh.err" ] && cat "${RUNNER_TEMP}/gh.err" >&2
              echo "is_member=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          if [ "$EVENT_NAME" = "issue_comment" ]; then
            : "${SENDER:?SENDER is empty on issue_comment event}"
            if [[ "$SENDER_TYPE" == "Bot" ]]; then
              echo "Comment sender $SENDER is a Bot; denying review."
              echo "is_member=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            SENDER_PERM=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${SENDER}/permission" --jq '.permission' 2>"${RUNNER_TEMP}/gh.err" || echo "none")
            SENDER_PERM=${SENDER_PERM:-none}
            case "$SENDER_PERM" in
              admin|write) ;;
              *)
                echo "Comment sender $SENDER has permission=$SENDER_PERM; denying review."
                [ -s "${RUNNER_TEMP}/gh.err" ] && cat "${RUNNER_TEMP}/gh.err" >&2
                echo "is_member=false" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          fi

          echo "is_member=true" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login || github.event.issue.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type || github.event.issue.user.type }}
          SENDER: ${{ github.event.comment.user.login }}
          SENDER_TYPE: ${{ github.event.comment.user.type }}

      # AGENTS.md / CLAUDE.md are bot instructions; skip review if a PR edits them
      # so the bot doesn't review under guidance the PR itself is modifying.
      - name: Skip AI review on trusted-instruction file edits
        if: steps.check-team.outputs.is_member == 'true'
        id: trusted_files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          FILES=$(gh pr diff "$PR_NUMBER" --repo "$REPO" --name-only)
          if echo "$FILES" | grep -qiE '(^|/)(AGENTS|CLAUDE)\.md$'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body \
              "AI review skipped: this PR modifies \`AGENTS.md\` or \`CLAUDE.md\` files, which the review bot reads as instructions. Edits to these files require human review."
            exit 1
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.check-team.outputs.is_member == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect follow-up review
        if: steps.check-team.outputs.is_member == 'true'
        id: followup
        run: |
          set -uo pipefail
          # Normalize null SHA (opened events send 0000000...)
          case "$BEFORE_SHA" in 0000000*) BEFORE_SHA="" ;; esac

          # Pull the latest bot-authored review carrying the AI review marker.
          # Capture body + submitted_at so we can scope author-reply fetches to
          # comments posted after the previous review.
          # claude-code-action posts under the `claude[bot]` GitHub App identity.
          PREVIOUS_REVIEW_OBJ=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews?per_page=100" \
            --paginate \
            --jq '[.[] | select(.user.login == "claude[bot]") | select(.body | contains("<!-- ai-review: claude-code gha"))] | last // empty' \
            2>/dev/null || { echo "warn: previous-review fetch failed (treating as no previous review)" >&2; echo ""; })

          PREVIOUS_REVIEW=""
          PREV_REVIEW_AT=""
          if [ -n "$PREVIOUS_REVIEW_OBJ" ]; then
            PREVIOUS_REVIEW=$(printf '%s' "$PREVIOUS_REVIEW_OBJ" | jq -r '.body // ""')
            PREV_REVIEW_AT=$(printf '%s' "$PREVIOUS_REVIEW_OBJ" | jq -r '.submitted_at // .created_at // ""')
          fi

          REVIEW_TYPE="first"

          if [ -n "$BEFORE_SHA" ] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            if git merge-base --is-ancestor "$BEFORE_SHA" HEAD 2>/dev/null; then
              # Tier 1: clean incremental diff (non-rebase push)
              git diff "${BEFORE_SHA}..HEAD" > "${RUNNER_TEMP}/incremental.diff" 2>/dev/null || true
              if [ ! -s "${RUNNER_TEMP}/incremental.diff" ]; then
                echo "No changes since last review. Skipping."
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              if [ -n "$PREVIOUS_REVIEW" ]; then
                REVIEW_TYPE="tier1"
              fi
            else
              echo "Rebase detected. Using prompt-based dedup."
              if [ -n "$PREVIOUS_REVIEW" ]; then
                REVIEW_TYPE="tier2"
              fi
            fi
          else
            if [ -n "$PREVIOUS_REVIEW" ]; then
              REVIEW_TYPE="tier2"
            fi
          fi

          echo "review_type=$REVIEW_TYPE" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

          if [ -s "${RUNNER_TEMP}/incremental.diff" ]; then
            echo "has_incremental=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_incremental=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$PREVIOUS_REVIEW" ]; then
            printf '%s\n' "$PREVIOUS_REVIEW" > "${RUNNER_TEMP}/previous_review.txt"
            echo "has_previous=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_previous=false" >> "$GITHUB_OUTPUT"
          fi

          # Fetch author replies posted after the previous review. Combines
          # issue comments (replies on the bot's review block) + inline review
          # comments (replies on changed lines). Restricted to the PR author
          # so a non-author commenter cannot post `@claude rejected:` markers
          # and override findings on the next review pass. Empty / non-JSON
          # `gh api` responses are coerced to `[]` before reaching jq so a
          # transient API hiccup can't hard-fail the step.
          AUTHOR_REPLIES_FILE="${RUNNER_TEMP}/author-replies.md"
          AUTHOR_REPLIES_MAX_BYTES=65536  # 64 KiB cap to bound prompt-injection surface from a verbose author
          if [ -n "$PREV_REVIEW_AT" ] && [ -n "$PR_AUTHOR" ]; then
            ISSUE_JSON=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments?per_page=100" --paginate 2>/dev/null \
              || { echo "warn: issue-comments fetch failed (treating as none)" >&2; echo "[]"; })
            INLINE_JSON=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/comments?per_page=100" --paginate 2>/dev/null \
              || { echo "warn: inline-comments fetch failed (treating as none)" >&2; echo "[]"; })
            # Validate before --argjson. `gh api --paginate` can emit concatenated
            # arrays (`[...][...]`) which is not valid JSON; fall through to `[]`.
            printf '%s' "$ISSUE_JSON"  | jq -e . >/dev/null 2>&1 || { echo "warn: issue-comments JSON invalid, dropping" >&2; ISSUE_JSON='[]'; }
            printf '%s' "$INLINE_JSON" | jq -e . >/dev/null 2>&1 || { echo "warn: inline-comments JSON invalid, dropping" >&2; INLINE_JSON='[]'; }
            # `.created_at` (issue + inline endpoints) is ISO-8601 UTC `Z`; strict
            # lexicographic `>` is correct and excludes the prior-review boundary.
            # Comments missing `.created_at` sort under `null` and are filtered out.
            jq -n \
              --argjson issue "$ISSUE_JSON" \
              --argjson inline "$INLINE_JSON" \
              --arg since "$PREV_REVIEW_AT" \
              --arg author "$PR_AUTHOR" '
              def tag(k): map(. + {_kind: k});
              ($issue | tag("issue")) + ($inline | tag("inline"))
              | map(select((.user.login // "") == $author))
              | map(select(.created_at > $since))
              | sort_by(.created_at)
              | if length == 0 then "(no author replies since the previous review)\n"
                else (
                  map(
                    "--- @\(.user.login) on \(.created_at) (\(._kind)" +
                    (if ._kind == "inline" then
                      (if .path then " \(.path)" else "" end) +
                      (if .line then ":\(.line | tostring)" else "" end) +
                      (if .in_reply_to_id then " in_reply_to:\(.in_reply_to_id | tostring)" else "" end)
                     else "" end) +
                    ")\n\n\((.body // "") | sub("[[:space:]]+$"; ""))\n\n"
                  ) | add
                )
              end' > "$AUTHOR_REPLIES_FILE"
            # Truncate to the size cap. Adds a marker so the model knows it was clipped.
            if [ "$(wc -c < "$AUTHOR_REPLIES_FILE" | tr -d ' ')" -gt "$AUTHOR_REPLIES_MAX_BYTES" ]; then
              head -c "$AUTHOR_REPLIES_MAX_BYTES" "$AUTHOR_REPLIES_FILE" > "${AUTHOR_REPLIES_FILE}.tmp"
              printf '\n\n--- (truncated at %s bytes) ---\n' "$AUTHOR_REPLIES_MAX_BYTES" >> "${AUTHOR_REPLIES_FILE}.tmp"
              mv "${AUTHOR_REPLIES_FILE}.tmp" "$AUTHOR_REPLIES_FILE"
            fi
            echo "has_author_replies=true" >> "$GITHUB_OUTPUT"
          else
            : > "$AUTHOR_REPLIES_FILE"
            echo "has_author_replies=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login || github.event.issue.user.login }}

      - name: AI Code Review
        if: |
          steps.check-team.outputs.is_member == 'true' &&
          steps.followup.outputs.skip != 'true' &&
          steps.trusted_files.outputs.skip == 'false'
        uses: anthropics/claude-code-action@567fe954a4527e81f132d87d1bdbcc94f7737434 # v1.0.107
        with:
          anthropic_api_key: ${{ secrets.AI_CODE_REVIEW_ANTHROPIC_API_KEY }}
          prompt: |
            You are a senior code reviewer for WooCommerce extensions.
            Review the PR diff for this repository.

            REPO: ${{ github.repository }}
            PR: #${{ github.event.pull_request.number || github.event.issue.number }}
            REVIEW_TYPE: ${{ steps.followup.outputs.review_type }}

            OBJECTIVE
            Review the code changes for correctness, security, backwards compatibility, and WooCommerce best practices. Be concise. If everything looks good, say so briefly. Only provide detailed feedback when there are meaningful improvements to suggest.

            FOLLOW-UP REVIEW HANDLING
            Check the REVIEW_TYPE value above:

            If REVIEW_TYPE is "tier1" (incremental, non-rebase push):
            - Read "${RUNNER_TEMP}/incremental.diff" for ONLY the new changes since the last review
            - Read "${RUNNER_TEMP}/previous_review.txt" for the previous review
            - Read "${RUNNER_TEMP}/author-replies.md" for author replies posted since the previous review
            - Focus your review on the incremental diff only
            - Produce a per-issue reconciliation (see PER-ISSUE RECONCILIATION below). Do not re-derive findings from a fresh read of the diff.
            - Only post inline comments for NEW issues

            If REVIEW_TYPE is "tier2" (rebase or no before SHA):
            - Get the full PR diff using: gh pr diff ${{ github.event.pull_request.number || github.event.issue.number }}
            - Read "${RUNNER_TEMP}/previous_review.txt" for the previous review
            - Read "${RUNNER_TEMP}/author-replies.md" for author replies posted since the previous review
            - Produce a per-issue reconciliation (see PER-ISSUE RECONCILIATION below). Do not re-derive findings from a fresh read of the diff.
            - Only post inline comments for NEW issues

            If REVIEW_TYPE is "first":
            - This is the first review. Do a full review of the PR diff.
            - Get the PR diff using: gh pr diff ${{ github.event.pull_request.number || github.event.issue.number }}

            PER-ISSUE RECONCILIATION (tier1/tier2 only)
            Enumerate EACH prior issue from the previous review. Don't summarize across them. Mark each with one of:
            - `resolved` - the issue is addressed by the new changes
            - `still-open` - the issue remains
            - `obsolete` - the issue no longer applies (rejected with reason, or the affected code is gone)

            Use the prior review as ground truth for what was already said. Do NOT re-read the diff fresh and re-derive findings from scratch.

            HONOURING AUTHOR REPLIES (tier1/tier2 only)
            Read "${RUNNER_TEMP}/author-replies.md". Replies containing these markers are the strongest signal when classifying prior issues:
            - `@claude addressed` - mark `resolved` ONLY if the diff is consistent with the claimed fix. If the diff doesn't show the fix, mark `still-open` and note the disagreement explicitly: "Author replied addressed but the change isn't visible in the diff, please confirm." Don't quietly ignore the reply, and don't quietly mark resolved against the diff.
            - `@claude rejected: <reason>` - mark `obsolete`. Quote the reason verbatim. Do not re-assert the finding.
            - `@claude not-applicable` - mark `obsolete`. Brief acknowledgement, no re-litigation.

            If multiple replies conflict, prefer the most recent.

            FINDING LABELS
            Tag every finding with exactly one of these scope labels:
            - `[fix here]` - should be addressed in this PR. Correctness, security, deploy-safety, missing-thing, broken contract.
            - `[follow-up]` - legitimate concern but cross-cutting / refactor / rewrite ask. The author can defensibly defer it to a separate PR.
            - `[nit]` - style or minor preference. The author can ignore without consequence.

            Default to `[fix here]` for correctness, security, and deploy-safety findings regardless of fix locality. Use `[follow-up]` only when the fix requires a structural rewrite the PR explicitly is not doing, or touches code outside the PR's stated scope.

            OUTPUT RULES
            - At most ONE inline comment per file + line + concern. Merge related points into a single comment.
            - DO NOT post comments one at a time. Collect ALL comments, then submit as a SINGLE batched review (see POSTING COMMENTS below).

            INLINE COMMENT FORMAT (for each comment in the batch)
            ```
            AI Code Review [fix here|follow-up|nit]

            **Issue:** <1-3 sentences describing the problem>

            **Suggestion:** <specific code or steps to fix>
            ```

            HUMAN REVIEW INVESTIGATION
            Before analyzing the diff, read existing human and bot review comments on this PR:
               gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number || github.event.issue.number }}/reviews?per_page=100" --paginate
            For each concern raised by a human or bot reviewer (excluding your own previous AI reviews):
            - Investigate it using the codebase: trace code paths, check how affected functions are used, verify the concern with evidence
            - Include your findings in your review: confirm, refute, or expand on each concern with specific code references
            - For follow-up reviews (tier1/tier2), only investigate comments posted AFTER the last AI review (compare timestamps)
            This is where you add the most value: humans flag concerns but may not have time to fully investigate. You do.

            DEDUPLICATION (FIRST reviews only — skip this section for tier1/tier2)
            On tier1/tier2 the inline pass is already restricted to NEW issues by OUTPUT RULES, and the per-issue reconciliation reuses the prior review as ground truth, so re-fetching existing inline comments is unnecessary and would interfere with reconciliation.

            For first reviews:
            1. Fetch ALL existing review comments on this PR:
               gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number || github.event.issue.number }}/comments?per_page=100" --paginate
            2. Filter to comments from "claude[bot]" that contain "AI Code Review"
            3. Build a list of already-covered concerns: for each existing comment, note the file path, line number, and the issue described
            4. When you find a potential issue, check your list - if an existing comment ALREADY covers the same concern on the same file (same or nearby lines within 5 lines), SKIP it

            DO NOT use HTML markers for deduplication.
            DO NOT try to PATCH/update existing comments.
            Simply SKIP adding to batch if the concern is already covered by an existing comment.

            POSTING COMMENTS (use batched review API via file)
            Post ALL comments as a SINGLE review to avoid spamming notifications.

            Step 1: Get the latest commit SHA:
               gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number || github.event.issue.number }}" --jq '.head.sha'

            Step 2: Use the Write tool to create a JSON file at ./ai_review_payload.json.
            Replace {{COMMIT_SHA}} with the SHA from Step 1.
            Replace {{SUMMARY}} with your review summary (see below).
            Ensure all string values are properly JSON-escaped: double quotes as \", backslashes as \\, newlines as \n.
            The `path` in each comment must be relative to the repository root, exactly as shown in the diff output.
            The `line` must be the line number in the new version of the file (the + side of the diff).

               {
                 "commit_id": "{{COMMIT_SHA}}",
                 "event": "COMMENT",
                 "body": "<!-- ai-review: claude-code gha sha:{{COMMIT_SHA}} before:${{ github.event.before }} -->\n{{SUMMARY}}\n{{HOUSEKEEPING}}\n\n---\n<!-- ai-review-footer -->\n<sub>Automatic review{{FOLLOW_UP_TAG}} · <code>${{ inputs.model || 'claude-opus-4-6' }}</code> · <a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">Workflow run</a></sub>\n\n<details><summary><sub>How to reply to a finding</sub></summary>\n\nReply on this review (or inline at the line the finding refers to) with one of:\n\n- `@claude addressed` - I made the change. Bot verifies against the next diff before marking resolved.\n- `@claude rejected: <reason>` - Will not fix; reason gets quoted on the next review.\n- `@claude not-applicable` - Finding does not apply (wrong file, already covered elsewhere, etc.).\n\nThe bot honours these on the next review pass.\n\n</details>",
                 "comments": [
                   {"path": "relative/file/path.php", "line": 42, "body": "comment text here"},
                   ...
                 ]
               }

            For {{SUMMARY}}:
            - First reviews: "AI Code Review - Found <N> potential issues" (or "No issues found" if none)
            - Follow-up reviews (tier1/tier2): "AI Code Review - Follow-up" followed by the per-issue reconciliation list (each prior issue on its own line as `- <issue ref>: resolved | still-open | obsolete - <one-line note>`) and then "New issues: <N>"
            For {{FOLLOW_UP_TAG}}: replace with " (follow-up)" for tier1/tier2 reviews, or "" (empty) for first reviews.
            For {{HOUSEKEEPING}}: render the trailing PR-housekeeping block (see PR HOUSEKEEPING below). Empty string if there is nothing to put in it.

            Step 3: Submit the review using the file as input:
               gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number || github.event.issue.number }}/reviews" -X POST --input ai_review_payload.json

            ALWAYS post a review, even if no issues are found. If the code looks good, submit a review with an empty comments array and a summary like "AI Code Review - No issues found. The changes look good."

            PR HOUSEKEEPING
            Check the PR description for:
            - Clear title: Does it describe what the PR does? (e.g., "Fix cart total calculation" not "Fix bug")
            - Description with reasoning: Does it explain WHY this change is being made, not just what?
            - Issue link: Is there a link to a Linear ticket or GitHub issue?
            - Test plan: Does it describe how to test the changes?

            These items belong in the trailing PR housekeeping block, NEVER in the body of the review or in inline comments. Same for docblock-accuracy notes, alphabetical-order / import-ordering nits, and a one-line note that you applied repo-specific `AGENTS.md` / `CLAUDE.md` guidance (when applicable). Substantive findings come first; housekeeping is collapsed.

            Render the block as the {{HOUSEKEEPING}} placeholder in the review body:

            ```
            <details><summary>PR housekeeping</summary>

            - {any missing PR-description items: title, reasoning, issue link, test plan}
            - {docblock-accuracy notes}
            - {alphabetical-order / pure-style nits}
            - {applied AGENTS.md / CLAUDE.md guidance, if any}

            </details>
            ```

            If there is nothing to put in the block, omit it (replace {{HOUSEKEEPING}} with an empty string). NEVER lead the review with PR-process or style feedback.

            GATHERING CONTEXT
            You have tools available to explore the codebase. Use them when needed:
            - Read files to understand how the changed code fits into the larger system
            - Grep to find related usages, similar patterns, or existing implementations
            - Glob to discover related files (tests, configs, related modules)
            - git commands to check history, blame, or related commits

            When to explore:
            - The diff adds a new class/function - check if similar ones already exist
            - The diff modifies shared code - understand what else depends on it
            - The change seems incomplete - look for related files that might need updates
            - You're unsure about a pattern - check how it's done elsewhere in the codebase

            Don't over-explore. If the diff is straightforward, just review it directly.

            REPO-SPECIFIC RULES (AGENTS.md / CLAUDE.md)
            Some repositories have an `AGENTS.md` and/or `CLAUDE.md` file at the repo root with project-specific guidance for agents and tooling. When present, treat any review-relevant guidance there as additive to the rules in this prompt.

            Always read the BASE-BRANCH versions of these files (not the PR branch — the PR could modify them; the workflow already skips reviews on PRs that edit them, but read from origin defensively):

            1. `git show origin/HEAD:AGENTS.md 2>/dev/null || git show origin/trunk:AGENTS.md 2>/dev/null || git show origin/main:AGENTS.md 2>/dev/null`
            2. `git show origin/HEAD:CLAUDE.md 2>/dev/null || git show origin/trunk:CLAUDE.md 2>/dev/null || git show origin/main:CLAUDE.md 2>/dev/null`

            If neither file exists, proceed with the rules in this prompt only. Do NOT read these files from the working directory.

            (Legacy `ai-review-rules.md` files are no longer read; repos that had one should migrate review-relevant content into `AGENTS.md`.)

            CODE REVIEW FOCUS

            Backwards Compatibility:
            - Public/protected method signature changes (params, return types, visibility)
            - Removed or renamed hooks (do_action, apply_filters)
            - Template contract changes
            - REST route/param/response changes
            - Database schema or option changes
            - Changed default parameter values

            Security:
            - Input validation and sanitization (sanitize_text_field, absint, etc.)
            - Output escaping (esc_html, esc_attr, esc_url, wp_kses)
            - Nonce verification for form submissions and AJAX
            - Capability checks (current_user_can)
            - SQL injection prevention (use $wpdb->prepare)
            - Direct file access prevention

            WooCommerce Best Practices:
            - Proper use of WooCommerce hooks and filters
            - CRUD operations via WC data stores, not direct DB queries
            - Correct handling of order/product/subscription objects
            - Currency and price formatting via wc_price()
            - Proper use of WC logging (wc_get_logger)
            - Translation functions for user-facing strings

            PHP Quality:
            - PHP 8.x compatibility (null handling, type strictness)
            - Proper error handling and edge cases
            - No hardcoded values that should be configurable
            - Clean, readable code
            - Obvious performance concerns (N+1 queries, unnecessary DB calls in loops, missing caching)

            Testing:
            - If there are tests, do they cover the key scenarios?
            - If there are no tests for critical logic, note it

            ANALYSIS BOUNDARIES
            Exclude: vendor/**, node_modules/**, build/**, dist/**, **/*.min.*, **/*.map, **/*.po, **/*.mo, images/binaries, generated artifacts.
            If the diff is very large (more than 2000 lines changed), focus on the most critical files first: files with security-sensitive changes, public API changes, or database operations. You do not need to comment on every file.

            Do NOT create or update Markdown files. Only create the JSON review payload file.

            METHOD
            1. Check REVIEW_TYPE and handle accordingly (see FOLLOW-UP REVIEW HANDLING above)
            2. For "first" reviews: fetch and catalog existing AI review comments (see DEDUPLICATION)
            3. For tier1/tier2: read previous_review.txt + author-replies.md, build the per-issue reconciliation BEFORE looking at new findings
            4. Get the appropriate diff (incremental for tier1, full PR diff for tier2/first)
               DO NOT use shell redirects (>, >>, |) - they are blocked. Just run the command directly.
            5. Analyze the diff against the CODE REVIEW FOCUS areas; label every finding [fix here] / [follow-up] / [nit]
            6. For each potential issue, check if already covered (skip if so)
            7. Build the {{SUMMARY}} (per-issue reconciliation lines for tier1/tier2, or counts for first) and the {{HOUSEKEEPING}} block (or empty)
            8. Use the Write tool to create ./ai_review_payload.json (include the HTML marker comment, the footer sentinel, and the cheat-sheet block exactly as shown)
            9. Submit: gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number || github.event.issue.number }}/reviews" -X POST --input ai_review_payload.json

          claude_args: >
            --model ${{ inputs.model || 'claude-opus-4-6' }}
            --allowedTools "Read(/home/runner/work/**),Glob,Grep,Write,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*),Bash(git show:*),Bash(git diff:*),Bash(git log:*),Bash(git blame:*),Bash(git rev-parse:*),Bash(git ls-files:*),Bash(git grep:*)"
