name: Linting

# The plugin's JavaScript gate (`pnpm run check:js`), the Markdown check and, with
# config.woo.capabilities.jsTests, the JavaScript unit tests.
#
#   js-lint:
#     uses: woocommerce/.github/.github/workflows/plugin-js-lint.yml@<commit SHA>

on:
  workflow_call:
    inputs:
      checkout-ref:
        type: string
      frontend:
        description: Run the JavaScript, CSS and package checks.
        type: boolean
        default: true
      docs:
        description: Run the Markdown check.
        type: boolean
        default: true

permissions:
  contents: read

jobs:

  js-linting-check:
    name: JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref }}
          persist-credentials: false

      - name: Read plugin metadata
        id: config
        uses: $/actions/read-plugin-config
        with:
          checkout: 'false'

      - name: Set up Node.js and the pnpm store cache
        uses: $/actions/setup-plugin-env
        with:
          node: true
          node-cache: ${{ inputs.checkout-ref == '' }}

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # The repository's JavaScript gate: licenses, package metadata, styles, scripts and types.
      # ESLint runs once, here: setup-node's ESLint problem matcher turns its output into
      # annotations, on fork pull requests too.
      - name: Run JavaScript checks
        if: ${{ inputs.frontend }}
        run: pnpm run check:js

      - name: Lint Markdown documentation
        if: ${{ inputs.docs }}
        run: pnpm run lint:md:docs

      - name: Run JavaScript unit tests
        if: ${{ inputs.frontend && fromJSON(steps.config.outputs.json).capabilities.jsTests }}
        run: pnpm run test:js

      - name: Upload JavaScript coverage report
        if: ${{ !cancelled() && inputs.frontend && hashFiles('coverage/clover.xml') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-js
          path: coverage/
          retention-days: 90

      - name: JavaScript coverage summary
        if: ${{ !cancelled() && inputs.frontend && hashFiles('coverage/clover.xml') != '' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          m = ET.parse('coverage/clover.xml').getroot().find('project/metrics')
          s, c = int(m.get('statements')), int(m.get('coveredstatements'))
          print(f"JS line coverage: {c}/{s} ({100 * c / s:.1f}%)" if s else "JS line coverage: no statements")
          PY
