name: Start Release

# Starts a plugin release: bumps the versions on a new release/X.Y.Z branch, compiles the changelog
# and opens the release pull request against trunk (bin/release_start.sh). The caller keeps the
# workflow_dispatch inputs and the concurrency group.
#
#   start:
#     name: Start
#     uses: woocommerce/.github/.github/workflows/plugin-release-start.yml@<commit SHA>
#     with:
#       version: ${{ inputs.version }}
#       wp_version: ${{ inputs.wp_version }}
#       wc_version: ${{ inputs.wc_version }}
#     secrets:
#       RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
#
# With `deploy: central`, the run needs no secrets and pushes nothing. It bumps the versions and
# compiles the changelog on the dispatched trunk commit, then uploads them as a
# release-patch-<run attempt> artifact. The central release workflow, which holds the release
# credentials, checks that run and opens the branch, PR and next milestone.

on:
  workflow_call:
    inputs:
      # Release version (X.Y.Z).
      version:
        type: string
        required: true
      # WordPress and WooCommerce "tested up to" (X.Y); empty keeps the current value.
      wp_version:
        type: string
        default: ''
      wc_version:
        type: string
        default: ''
      # Who pushes the release branch: 'plugin' (this run, with RELEASE_TOKEN) or 'central'.
      deploy:
        type: string
        default: plugin
    secrets:
      # Required when deploy is 'plugin'. Must be a personal access token: pushes and pull requests
      # made with the default token do not trigger other workflows, so the release smoke test would
      # never run.
      RELEASE_TOKEN:
        required: false

permissions:
  contents: read

jobs:

    start-release:
        name: ${{ inputs.deploy == 'central' && 'Prepare release patch' || 'Create release branch and PR' }}
        runs-on: ubuntu-latest
        timeout-minutes: 5
        env:
          VERSION: ${{ inputs.version }}
          WP_VERSION: ${{ inputs.wp_version }}
          WC_VERSION: ${{ inputs.wc_version }}
          DEPLOY: ${{ inputs.deploy }}

        steps:

            # Central mode builds on the dispatched commit, so the patch base is the run's head_sha.
            - name: Checkout trunk
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                ref: ${{ inputs.deploy == 'central' && github.sha || 'trunk' }}
                persist-credentials: false

            - name: Validate inputs
              env:
                HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
              run: |
                case "$DEPLOY" in
                  plugin)
                    if [[ "$HAS_RELEASE_TOKEN" != true ]]; then
                      echo "::error::RELEASE_TOKEN is required when deploy is 'plugin'."
                      exit 1
                    fi
                    ;;
                  central)
                    if [[ "$HAS_RELEASE_TOKEN" == true ]]; then
                      echo "::error::With deploy 'central', don't forward RELEASE_TOKEN."
                      exit 1
                    fi
                    if [[ "$GITHUB_REF" != refs/heads/trunk ]]; then
                      echo "::error::Run Start Release from trunk."
                      exit 1
                    fi
                    ;;
                  *)
                    echo "::error::Invalid deploy '$DEPLOY'. Expected 'plugin' or 'central'."
                    exit 1
                    ;;
                esac
                if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                  echo "::error::Invalid version format '$VERSION'. Expected X.Y.Z."
                  exit 1
                fi
                if [[ -n "$WP_VERSION" && ! "$WP_VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
                  echo "::error::Invalid WP version format '$WP_VERSION'. Expected X.X."
                  exit 1
                fi
                if [[ -n "$WC_VERSION" && ! "$WC_VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
                  echo "::error::Invalid WC version format '$WC_VERSION'. Expected X.X."
                  exit 1
                fi

            - name: Pre-flight checks
              env:
                GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
                GIT_TERMINAL_PROMPT: 0
              run: |
                # In central mode, the central release workflow runs these checks with its own token.
                if [[ "$DEPLOY" == plugin ]]; then
                  OPEN_RELEASE_PRS=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&base=trunk&per_page=100" \
                    --jq '.[] | select(.head.repo.full_name == .base.repo.full_name and (.head.ref | startswith("release/"))) | .number')
                  if [[ -n "$OPEN_RELEASE_PRS" ]]; then
                    echo "::error::Finish or close the existing release PR before cutting another release."
                    echo "If Start Release failed after opening the PR, see the summary of that failed attempt for recovery steps."
                    exit 1
                  fi

                  RELEASE_REF=$(git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
                    ls-remote --heads origin "refs/heads/release/${VERSION}")
                  if [[ -n "$RELEASE_REF" ]]; then
                    echo "::error::Branch release/${VERSION} already exists."
                    echo "If Start Release failed after pushing the branch, see the summary of that failed attempt for recovery steps."
                    exit 1
                  fi
                fi

                # Ignore dotfiles: changelog/.gitkeep keeps the directory in git.
                CHANGE_FILES=$(find changelog -maxdepth 1 -type f ! -name '.*' | wc -l)
                if [[ "$CHANGE_FILES" -eq 0 ]]; then
                  echo "::error::No change files under changelog/. Nothing to release."
                  exit 1
                fi
                echo "Found ${CHANGE_FILES} change file(s) to compile."

            - name: Find GitHub milestone
              if: inputs.deploy == 'plugin'
              id: milestone
              env:
                GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
              run: |
                MILESTONE_NUMBER=$(gh api --paginate "repos/${{ github.repository }}/milestones?state=open&per_page=100" --jq ".[] | select(.title == \"${VERSION}\") | .number")
                if [[ -z "$MILESTONE_NUMBER" ]]; then
                  echo "::error::No open milestone titled '${VERSION}' found. Create one at https://github.com/${{ github.repository }}/milestones/new first."
                  exit 1
                fi
                echo "number=$MILESTONE_NUMBER" >> $GITHUB_OUTPUT
                echo "url=https://github.com/${{ github.repository }}/milestone/${MILESTONE_NUMBER}?closed=1" >> $GITHUB_OUTPUT

            - name: Set up PHP
              uses: $/actions/setup-plugin-env
              with:
                php-version: '8.4'

            - name: Read plugin metadata
              id: config
              uses: $/actions/read-plugin-config
              with:
                checkout: 'false'

            - name: Load release tools
              id: tools
              uses: $/actions/plugin-release-tools

            - name: Bump versions
              env:
                RELEASE_TOOLS: ${{ steps.tools.outputs.directory }}
                CONFIG_READER: ${{ steps.config.outputs.reader }}
              run: |
                ARGS=( "$VERSION" )
                [[ -n "$WP_VERSION" ]] && ARGS+=( --wp "$WP_VERSION" )
                [[ -n "$WC_VERSION" ]] && ARGS+=( --wc "$WC_VERSION" )
                bash "$RELEASE_TOOLS/update_version.sh" "${ARGS[@]}"

            - name: Install PHP dependencies
              run: composer install --prefer-dist --no-progress --no-ansi --no-interaction

            # Use the PR validator over all the change files that the release will compile.
            - name: Validate all changelog entries
              uses: $/actions/check-changelog
              with:
                all: 'true'

            - name: Compile changelog
              run: |
                # Compiles changelog/ into changelog.txt under the release version and
                # today's date, then deletes the change files it consumed. Deliberately
                # no --yes: in non-interactive mode that would push past a bad change
                # file instead of stopping the release.
                php vendor/bin/changelogger write --use-version="$VERSION" --no-interaction

                echo "Compiled changelog entries for ${VERSION}:"
                sed -n '3,/^$/p' changelog.txt

            # WordPress.org reads the changelog from readme.txt (config.woo.release.readmeChangelog).
            - name: Sync readme.txt changelog
              if: fromJSON(steps.config.outputs.json).release.readmeChangelog
              env:
                RELEASE_TOOLS: ${{ steps.tools.outputs.directory }}
              run: bash "$RELEASE_TOOLS/sync_readme_changelog.sh" "$VERSION"

            - name: Open the next release milestone
              if: inputs.deploy == 'plugin'
              env:
                GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
              run: |
                NEXT_VERSION=$(awk -F. '{print $1"."$2"."($3+1)}' <<< "$VERSION")
                OPEN_MILESTONES=$(gh api --paginate "repos/$GITHUB_REPOSITORY/milestones?state=open&per_page=100" --jq '.[].title')
                if ! grep -Fxq "$NEXT_VERSION" <<< "$OPEN_MILESTONES"; then
                  gh api --method POST "repos/$GITHUB_REPOSITORY/milestones" -f "title=$NEXT_VERSION" > /dev/null
                fi
                echo "Use milestone \`$NEXT_VERSION\` for changes merged after the branch cut." >> "$GITHUB_STEP_SUMMARY"

            - name: Commit release branch
              run: |
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git checkout -b "release/${VERSION}"
                git add -u
                git commit -m "Bump version to ${VERSION}"

            - name: Prepare the release patch
              if: inputs.deploy == 'central'
              id: patch
              run: |
                set -o pipefail
                BASE_SHA=$(git rev-parse HEAD~1)
                if [[ "$BASE_SHA" != "$GITHUB_SHA" ]]; then
                  echo "::error::The release commit must sit on the dispatched commit $GITHUB_SHA."
                  exit 1
                fi
                CHANGELOG=$(git show HEAD:changelog.txt | awk -v heading="= ${VERSION} - " 'index($0, heading) == 1 && !found {found=1; next} found && /^= /{done=1} found && !done')
                if [[ -z "$CHANGELOG" ]]; then
                  echo "::error::changelog.txt has no entries under '= ${VERSION} - '."
                  exit 1
                fi

                PATCH_DIR=$(mktemp -d "$RUNNER_TEMP/release-patch.XXXXXX")
                echo "dir=$PATCH_DIR" >> "$GITHUB_OUTPUT"
                git diff --binary --full-index --no-ext-diff --no-textconv --no-renames --no-color \
                  "$BASE_SHA" HEAD > "$PATCH_DIR/release.patch"
                jq -n \
                  --arg version "$VERSION" \
                  --arg base_sha "$BASE_SHA" \
                  --arg wp_version "$WP_VERSION" \
                  --arg wc_version "$WC_VERSION" \
                  --arg changelog "$CHANGELOG" \
                  '{version: $version, base_sha: $base_sha, wp_version: $wp_version, wc_version: $wc_version, changelog: $changelog}' \
                  > "$PATCH_DIR/release.json"

                {
                  echo "Prepared the ${VERSION} release patch on \`${BASE_SHA}\`. The central release workflow opens the release PR."
                  echo ""
                  git diff --stat "$BASE_SHA" HEAD | sed 's/^/    /'
                } >> "$GITHUB_STEP_SUMMARY"

            - name: Upload the release patch
              if: inputs.deploy == 'central'
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                name: release-patch-${{ github.run_attempt }}
                path: |
                  ${{ steps.patch.outputs.dir }}/release.patch
                  ${{ steps.patch.outputs.dir }}/release.json
                if-no-files-found: error
                retention-days: 3

            - name: Prepare the changelog comparison and recovery instructions
              if: inputs.deploy == 'plugin'
              env:
                GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
                MILESTONE_NUMBER: ${{ steps.milestone.outputs.number }}
                MILESTONE_URL: ${{ steps.milestone.outputs.url }}
              run: |
                RELEASE_COMMIT=$(git rev-parse HEAD)
                CHANGELOG=$(git show HEAD:changelog.txt | awk -v heading="= ${VERSION} - " 'index($0, heading) == 1 && !found {found=1; next} found && /^= /{done=1} found && !done')
                ISSUES=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?milestone=${MILESTONE_NUMBER}&state=all&per_page=100" --jq '.[] | "- #\(.number) \(.title)"' || echo "(could not fetch milestone issues)")

                cat > "$RUNNER_TEMP/release-comparison.md" <<EOF
                ### Changelog entries for ${VERSION}

                \`\`\`
                ${CHANGELOG}
                \`\`\`

                ### Milestone issues

                ${ISSUES}

                Every milestone issue should have a matching changelog entry. Compare before approving.
                EOF

                # Save this before the push so the operator has it even if a later write fails.
                {
                  cat <<EOF
                ### If a later step fails

                Prepared \`release/${VERSION}\` at \`${RELEASE_COMMIT}\` for [milestone ${VERSION}](${MILESTONE_URL}).

                1. Check the branch and any open release PR in \`${GITHUB_REPOSITORY}\`. If another release PR is open or the branch or PR head differs from the prepared commit, check with the release owner before continuing.
                2. If the branch and release PR are both missing, rerun Start Release. If the branch exists without a PR, open \`Release ${VERSION}\` from \`release/${VERSION}\` into \`trunk\` in the same repository. Use \`Milestone: ${MILESTONE_URL}\` as the PR body. Reuse an existing PR if it has that head and base.
                3. If the changelog comparison is missing from the PR, post the comparison below as a comment. Paste the changelog entries into a fenced code block and check the milestone for issues added since the failed attempt.

                EOF
                  cat "$RUNNER_TEMP/release-comparison.md"
                } >> "$GITHUB_STEP_SUMMARY"

            - name: Push release branch
              if: inputs.deploy == 'plugin'
              env:
                GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
                GIT_TERMINAL_PROMPT: 0
              run: |
                git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
                  push origin "release/${VERSION}"

            - name: Create release PR
              if: inputs.deploy == 'plugin'
              id: pr
              env:
                GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
              run: |
                PR_URL=$(gh pr create \
                  --repo "${{ github.repository }}" \
                  --base trunk \
                  --head "release/${VERSION}" \
                  --title "Release ${VERSION}" \
                  --body "Milestone: ${{ steps.milestone.outputs.url }}")
                echo "url=$PR_URL" >> $GITHUB_OUTPUT
                echo "Release PR: $PR_URL"

            - name: Post changelog vs milestone comparison
              if: inputs.deploy == 'plugin'
              env:
                GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
                PR_URL: ${{ steps.pr.outputs.url }}
              run: |
                gh pr comment "$PR_URL" --body-file "$RUNNER_TEMP/release-comparison.md"

            - name: Summary
              if: inputs.deploy == 'plugin'
              run: |
                echo "Release PR created: ${{ steps.pr.outputs.url }}" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
                echo "Next steps:" >> $GITHUB_STEP_SUMMARY
                echo "- Wait for the smoke test CI to pass on the release branch." >> $GITHUB_STEP_SUMMARY
                echo "- Review the changelog vs milestone comparison comment." >> $GITHUB_STEP_SUMMARY
                echo "- After review, run **Publish release** from trunk with \`release/$VERSION\` as input." >> "$GITHUB_STEP_SUMMARY"
