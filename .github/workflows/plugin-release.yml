name: Publish release

# Publishes a plugin release from its release/X.Y.Z branch: resolves the one ready release pull
# request and pins its commit, runs the plugin's checks on it, builds the production ZIP once,
# verifies it with Plugin Check and E2E, creates the GitHub release, deploys the same ZIP to
# WooCommerce.com or WordPress.org, merges the release pull request at the pinned commit, and closes the
# milestone. config.woo.release picks the destination. The caller keeps the workflow_dispatch input,
# runs from trunk and holds the concurrency group, so two releases never overlap.
#
#   publish:
#     name: Publish
#     permissions:
#       actions: read
#       checks: read
#       contents: write
#       issues: write
#       pull-requests: read
#       statuses: read
#     uses: woocommerce/.github/.github/workflows/plugin-release.yml@<commit SHA>
#     with:
#       branch: ${{ inputs.branch }}
#       slack-channel: '#team-releases'
#     secrets:
#       RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
#       ...
#
# With `deploy: central`, the run stops after creating the GitHub release. The central release
# workflow deploys that archive, merges the release pull request and closes the milestone, so the
# caller forwards no secrets beyond ORG_DOWNLOADS for E2E. Forwarding RELEASE_TOKEN or a deploy
# secret fails the run.

on:
  workflow_call:
    inputs:
      # The release branch, release/X.Y.Z.
      branch:
        type: string
        required: true
      # Who deploys and merges: 'plugin' (this run, with the deploy secrets) or 'central'.
      deploy:
        type: string
        default: plugin
      slack-channel:
        description: Slack destination. Leave blank to skip notifications.
        type: string
        required: false
    secrets:
      # Private plugin downloads for E2E.
      ORG_DOWNLOADS:
        required: false
      # WooCommerce.com deployment (Marketplace plugins).
      ORG_PARTNER_USER:
        required: false
      ORG_PARTNER_DEPLOY_SECRET:
        required: false
      # WordPress.org deployment: woo-product-deploy checkout and SVN credentials.
      ORG_DEPLOY_SECRET:
        required: false
      WPORG_USERNAME:
        required: false
      WPORG_PASSWORD:
        required: false
      # A token that can merge the release pull request (the default token cannot trigger workflows).
      # Required when deploy is 'plugin'.
      RELEASE_TOKEN:
        required: false
      SLACK_WEBHOOK_URL:
        required: false

permissions:
  contents: read

jobs:

    # Release jobs check out a branch SHA without saving dependency caches in trunk.
    check-versions:
        name: Check versions
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
          release_version: ${{ steps.candidate.outputs.version }}
          commit: ${{ steps.candidate.outputs.commit }}
          pull-request: ${{ steps.candidate.outputs.pull-request }}
          config: ${{ steps.config.outputs.json }}

        permissions:
          actions: read
          checks: read
          contents: read
          pull-requests: read
          statuses: read
        steps:

            - name: Resolve release PR and commit
              id: candidate
              env:
                GH_TOKEN: ${{ github.token }}
                RELEASE_BRANCH: ${{ inputs.branch }}
                DEPLOY: ${{ inputs.deploy }}
                HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
                HAS_DEPLOY_SECRETS: ${{ secrets.RELEASE_TOKEN != '' || secrets.ORG_PARTNER_USER != '' || secrets.ORG_PARTNER_DEPLOY_SECRET != '' || secrets.ORG_DEPLOY_SECRET != '' || secrets.WPORG_USERNAME != '' || secrets.WPORG_PASSWORD != '' }}
              run: |
                if [[ "$DEPLOY" != plugin && "$DEPLOY" != central ]]; then
                  echo "::error::Invalid deploy '$DEPLOY'. Expected 'plugin' or 'central'."
                  exit 1
                fi
                if [[ "$DEPLOY" == plugin && "$HAS_RELEASE_TOKEN" != true ]]; then
                  echo "::error::RELEASE_TOKEN is required when deploy is 'plugin'."
                  exit 1
                fi
                if [[ "$DEPLOY" == central && "$HAS_DEPLOY_SECRETS" == true ]]; then
                  echo "::error::With deploy 'central', don't forward RELEASE_TOKEN or deploy secrets."
                  exit 1
                fi
                if [[ "$GITHUB_REF" != refs/heads/trunk || ! "$RELEASE_BRANCH" =~ ^release/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                  echo "::error::Run this workflow from trunk with a release/X.Y.Z branch."
                  exit 1
                fi

                pr=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
                  -f state=open -f base=trunk -f "head=${GITHUB_REPOSITORY_OWNER}:$RELEASE_BRANCH" |
                  jq -e --arg repo "$GITHUB_REPOSITORY" --arg ref "$RELEASE_BRANCH" \
                    '[.[] | select(.head.repo.full_name == $repo and .head.ref == $ref and .draft == false)] |
                     if length == 1 then .[0] else error("Expected one open release PR") end')
                sha=$(jq -er '.head.sha | select(test("^[a-f0-9]{40}$"))' <<< "$pr")
                pr_number=$(jq -er .number <<< "$pr")
                gh pr checks "$pr_number" --repo "$GITHUB_REPOSITORY" --required
                for attempt in 1 2 3; do
                  state=$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json headRefOid,mergeStateStatus,reviewDecision)
                  if [[ $(jq -r .mergeStateStatus <<< "$state") != UNKNOWN || "$attempt" == 3 ]]; then
                    break
                  fi
                  sleep 3
                done
                jq -e --arg sha "$sha" '
                  .headRefOid == $sha and
                  (.mergeStateStatus == "CLEAN" or .mergeStateStatus == "UNSTABLE") and
                  (.reviewDecision == "" or .reviewDecision == "APPROVED")
                ' <<< "$state" > /dev/null ||
                  { echo "::error::The release PR head must match and meet the trunk merge requirements."; exit 1; }

                # Called, this job is named "<caller job> / Check versions".
                for (( attempt=1; attempt<GITHUB_RUN_ATTEMPT; attempt++ )); do
                  original=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$attempt/jobs?per_page=100" \
                    --jq '.jobs[] | select(.name | endswith(" / Check versions")) | .conclusion')
                  if [[ "$original" == success ]]; then
                    echo "::error::Re-run failed jobs from the attempt that pinned the release commit and ZIP."
                    exit 1
                  fi
                done
                {
                  echo "commit=$sha"
                  echo "pull-request=$pr_number"
                  echo "version=${RELEASE_BRANCH#release/}"
                } >> "$GITHUB_OUTPUT"
                echo "Publishing \`$RELEASE_BRANCH\` at \`$sha\`." >> "$GITHUB_STEP_SUMMARY"

            - name: Checkout trunk metadata
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: Checkout release commit
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                ref: ${{ steps.candidate.outputs.commit }}
                path: release-candidate
                persist-credentials: false

            # Capabilities and deployment settings come from trunk. Version checks read the candidate.
            - name: Read plugin metadata
              id: config
              uses: $/actions/read-plugin-config
              with:
                checkout: 'false'

            - name: Load release tools
              id: tools
              uses: $/actions/plugin-release-tools

            - name: Check versions
              working-directory: release-candidate
              env:
                RELEASE_TOOLS: ${{ steps.tools.outputs.directory }}
                RELEASE_VERSION: ${{ steps.candidate.outputs.version }}
                CONFIG_READER: ${{ steps.config.outputs.reader }}
              run: bash "$RELEASE_TOOLS/check_versions.sh"

    php-lint:
        name: PHP
        needs: check-versions
        uses: ./.github/workflows/plugin-php-lint.yml
        with:
          checkout-ref: ${{ needs.check-versions.outputs.commit }}

    js-lint:
        if: ${{ fromJSON(needs.check-versions.outputs.config).capabilities.js }}
        name: JS Linting
        needs: check-versions
        uses: ./.github/workflows/plugin-js-lint.yml
        with:
          checkout-ref: ${{ needs.check-versions.outputs.commit }}

    php-tests:
        if: ${{ fromJSON(needs.check-versions.outputs.config).capabilities.phpunit }}
        name: PHP
        needs: [check-versions, php-lint]
        uses: ./.github/workflows/plugin-phpunit.yml
        with:
          checkout-ref: ${{ needs.check-versions.outputs.commit }}

    build_project:
        if: ${{ !failure() && !cancelled() }}
        name: Package
        needs: [check-versions, php-tests, php-lint, js-lint]
        uses: ./.github/workflows/plugin-build-zip.yml
        with:
          checkout-ref: ${{ needs.check-versions.outputs.commit }}
          artifact-name: release-candidate-${{ github.run_attempt }}

    e2e-tests:
        if: ${{ fromJSON(needs.check-versions.outputs.config).capabilities.e2e }}
        name: E2E tests
        needs: [check-versions, build_project]
        permissions:
          contents: read
          actions: read
        uses: ./.github/workflows/plugin-e2e.yml
        with:
          artifact-id: ${{ needs.build_project.outputs.artifact-id }}
          source-sha: ${{ needs.build_project.outputs.source-sha }}
          sha256: ${{ needs.build_project.outputs.sha256 }}
          checkout-ref: ${{ needs.check-versions.outputs.commit }}
          trusted-plugins: true
        secrets:
          ORG_DOWNLOADS: ${{ secrets.ORG_DOWNLOADS }}

    check-release-archive:
        if: ${{ fromJSON(needs.check-versions.outputs.config).capabilities.pluginCheck }}
        name: Check release archive
        needs: [build_project, check-versions]
        permissions:
          contents: read
          actions: read
        uses: ./.github/workflows/plugin-check.yml
        with:
          artifact-id: ${{ needs.build_project.outputs.artifact-id }}
          source-sha: ${{ needs.build_project.outputs.source-sha }}
          expected-source-sha: ${{ needs.check-versions.outputs.commit }}
          sha256: ${{ needs.build_project.outputs.sha256 }}

    release:
        # Every check the plugin has must pass; checks it does not have are skipped.
        if: ${{ !failure() && !cancelled() && needs.build_project.result == 'success' }}
        name: Release
        needs: [ check-release-archive, e2e-tests, build_project, check-versions ]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
          contents: write
          actions: read
        outputs:
          artifact_id: ${{ needs.build_project.outputs.artifact-id }}
          archive: ${{ steps.release_identity.outputs.archive }}
          sha256: ${{ steps.release_identity.outputs.sha256 }}
          version: ${{ steps.release_identity.outputs.version }}
        env:
          GH_RELEASE_COMMIT: ${{ needs.check-versions.outputs.commit }}
          RELEASE_VERSION: ${{ needs.check-versions.outputs.release_version }}
          RELEASE_ARCHIVE: ${{ needs.build_project.outputs.slug }}.zip
          CANDIDATE_SHA: ${{ needs.build_project.outputs.source-sha }}
          CANDIDATE_SHA256: ${{ needs.build_project.outputs.sha256 }}

        steps:

            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                ref: ${{ needs.check-versions.outputs.commit }}
                persist-credentials: false

            - name: Load release tools
              id: tools
              uses: $/actions/plugin-release-tools

            - name: Require a release candidate ID
              env:
                CANDIDATE_ID: ${{ needs.build_project.outputs.artifact-id }}
              run: |
                if [[ ! "$CANDIDATE_ID" =~ ^[1-9][0-9]*$ ]]; then
                  echo "A single release candidate artifact ID is required." >&2
                  exit 1
                fi

            - name: Download the release artifact
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
              with:
                artifact-ids: ${{ needs.build_project.outputs.artifact-id }}
                path: .

            - name: Install tools
              run: |
                sudo apt-get install jq

            - name: Verify release artifact
              id: release_identity
              run: |
                test "$GH_RELEASE_COMMIT" = "$CANDIDATE_SHA"
                printf '%s  %s\n' "$CANDIDATE_SHA256" "$RELEASE_ARCHIVE" | sha256sum --check -
                test -n "$RELEASE_VERSION"
                test -s "$RELEASE_ARCHIVE"
                jq -e --arg version "$RELEASE_VERSION" '.version == $version' package.json > /dev/null
                echo "archive=$RELEASE_ARCHIVE" >> "$GITHUB_OUTPUT"
                echo "sha256=$CANDIDATE_SHA256" >> "$GITHUB_OUTPUT"
                echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

            - name: Release
              env:
                GH_TOKEN: ${{ github.token }}
                RELEASE_TOOLS: ${{ steps.tools.outputs.directory }}
              run: bash "$RELEASE_TOOLS/release.sh"

            - name: Hand over to the central release workflow
              if: inputs.deploy == 'central'
              run: |
                echo "Released \`${RELEASE_ARCHIVE}\` for ${RELEASE_VERSION} (SHA-256 \`${CANDIDATE_SHA256}\`). The central release workflow deploys it, merges the release PR and closes the milestone." >> "$GITHUB_STEP_SUMMARY"

    # config.woo.release.target "woocommerce.com": submit the released archive to the marketplace.
    submit-deployment:
        if: ${{ inputs.deploy == 'plugin' && fromJSON(needs.check-versions.outputs.config).release.target == 'woocommerce.com' }}
        name: Submit to WooCommerce.com
        needs: [release, check-versions]
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
          actions: read
          contents: read
        env:
          # Use the same reviewed product ID for submission and confirmation.
          PRODUCT_ID: ${{ fromJSON(needs.check-versions.outputs.config).release.productId }}
          RELEASE_ARTIFACT_ID: ${{ needs.release.outputs.artifact_id }}
          RELEASE_ARCHIVE: ${{ needs.release.outputs.archive }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          RELEASE_SHA256: ${{ needs.release.outputs.sha256 }}

        steps:

            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                ref: ${{ needs.check-versions.outputs.commit }}
                persist-credentials: false

            - name: Load release tools
              id: tools
              uses: $/actions/plugin-release-tools

            - name: Check release artifact identity
              run: |
                if [[ ! "$RELEASE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]; then
                  echo "A single release artifact ID is required."
                  exit 1
                fi

            - name: Download the released archive
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
              with:
                artifact-ids: ${{ env.RELEASE_ARTIFACT_ID }}
                path: .

            - name: Check for an earlier submission attempt
              env:
                GH_TOKEN: ${{ github.token }}
              run: |
                # Called, this job is named "<caller job> / Submit to WooCommerce.com".
                for (( attempt=1; attempt<GITHUB_RUN_ATTEMPT; attempt++ )); do
                  jobs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$attempt/jobs?per_page=100" \
                    --jq '.jobs[] | select(.name | endswith(" / Submit to WooCommerce.com")) | .steps[] | select(.name == "Submit archive to WooCommerce.com" and .started_at != null and .conclusion != "skipped") | .name')
                  if [[ -n "$jobs" ]]; then
                    echo "UPLOAD_PREVIOUSLY_ATTEMPTED=true" >> "$GITHUB_ENV"
                    break
                  fi
                done

            - name: Check marketplace submission status
              id: marketplace
              env:
                RELEASE_TOOLS: ${{ steps.tools.outputs.directory }}
                # Organization partner credentials, shared by the woocommerce/* repositories.
                DEPLOY_API_KEY: ${{ secrets.ORG_PARTNER_USER }}
                DEPLOY_API_SECRET: ${{ secrets.ORG_PARTNER_DEPLOY_SECRET }}
              run: bash "$RELEASE_TOOLS/deploy.sh" prepare

            - name: Submit archive to WooCommerce.com
              if: steps.marketplace.outputs.upload == 'true'
              env:
                RELEASE_TOOLS: ${{ steps.tools.outputs.directory }}
                DEPLOY_API_KEY: ${{ secrets.ORG_PARTNER_USER }}
                DEPLOY_API_SECRET: ${{ secrets.ORG_PARTNER_DEPLOY_SECRET }}
              run: bash "$RELEASE_TOOLS/deploy.sh" submit

    deploy:
        name: Confirm deployment
        needs: [submit-deployment, release, check-versions]
        runs-on: ubuntu-latest
        timeout-minutes: 90
        env:
          PRODUCT_ID: ${{ fromJSON(needs.check-versions.outputs.config).release.productId }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        steps:
            - name: Load release tools
              id: tools
              uses: $/actions/plugin-release-tools

            - name: Wait for the marketplace to offer the release version
              env:
                RELEASE_TOOLS: ${{ steps.tools.outputs.directory }}
              run: bash "$RELEASE_TOOLS/deploy.sh" confirm

    # config.woo.release.target "wordpress.org": deploys to WordPress.org once config.woo.release.wpOrgSlug
    # is set. Without it, the job finishes after the artifact checks and the release ends at the
    # GitHub release created above.
    deploy-wporg:
        if: ${{ inputs.deploy == 'plugin' && fromJSON(needs.check-versions.outputs.config).release.target == 'wordpress.org' }}
        name: Deploy to WordPress.org
        needs: [ release, check-versions, build_project ]
        runs-on: ubuntu-latest
        # The deploy may take its full 60 minutes; the confirmation then waits up to 10.
        timeout-minutes: 75
        env:
          WP_ORG_SLUG: ${{ fromJSON(needs.check-versions.outputs.config).release.wpOrgSlug }}
          RELEASE_ARTIFACT_ID: ${{ needs.release.outputs.artifact_id }}
          RELEASE_ARCHIVE: ${{ needs.release.outputs.archive }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          RELEASE_SHA256: ${{ needs.release.outputs.sha256 }}

        steps:

            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                ref: ${{ needs.check-versions.outputs.commit }}
                persist-credentials: false

            - name: Check release artifact identity
              run: |
                if [[ ! "$RELEASE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]; then
                  echo "A single release artifact ID is required."
                  exit 1
                fi

            - name: Download the released archive
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
              with:
                artifact-ids: ${{ env.RELEASE_ARTIFACT_ID }}
                path: .

            - name: Load release tools
              id: tools
              if: env.WP_ORG_SLUG != ''
              uses: $/actions/plugin-release-tools

            # A retry after the SVN commit landed finds the tag already holding this archive and
            # skips the deploy, which would otherwise fail on the existing tag.
            - name: Check WordPress.org for this version
              id: wporg
              if: env.WP_ORG_SLUG != ''
              env:
                RELEASE_TOOLS: ${{ steps.tools.outputs.directory }}
              run: |
                command -v svn > /dev/null || { sudo apt-get update && sudo apt-get install -y subversion; }
                bash "$RELEASE_TOOLS/wporg-deploy.sh" prepare

            - name: Checkout the woo-product-deploy action
              if: steps.wporg.outputs.deploy == 'true'
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                repository: woocommerce/woo-product-deploy
                # Pinned for review. To bump: take `gh api repos/woocommerce/woo-product-deploy/commits/trunk --jq .sha`,
                # review the diff since this SHA, then update the SHA and date.
                ref: 0ef871021cdf6c4183a6b0470ee6a7be844d748a # trunk @ 2026-10-02
                path: ./.github/actions/woo-product-deploy
                token: ${{ secrets.ORG_DEPLOY_SECRET }}
                persist-credentials: false

            # The action pushes the archive released above to WordPress.org as is: it checks the
            # checksum and the Version header, and does not rebuild. The GitHub release already exists.
            - name: Deploy to WordPress.org
              if: steps.wporg.outputs.deploy == 'true'
              uses: ./.github/actions/woo-product-deploy
              with:
                repo_url: https://github.com/${{ github.repository }}
                branch: ${{ inputs.branch }}
                commit: ${{ needs.check-versions.outputs.commit }}
                version: ${{ env.RELEASE_VERSION }}
                zip: ${{ env.RELEASE_ARCHIVE }}
                zip_sha256: ${{ env.RELEASE_SHA256 }}
                node_version: '24'
                npm_version: '11'
                simulate: false
                wporg_release: true
                github_release: false
                deploy_pat: ${{ secrets.ORG_DEPLOY_SECRET }}
                wporg_username: ${{ secrets.WPORG_USERNAME }}
                wporg_password: ${{ secrets.WPORG_PASSWORD }}

            - name: Wait for WordPress.org to offer the release version
              if: env.WP_ORG_SLUG != ''
              env:
                RELEASE_TOOLS: ${{ steps.tools.outputs.directory }}
              run: bash "$RELEASE_TOOLS/wporg-deploy.sh" confirm

    merge-release:
        if: ${{ !failure() && !cancelled() && (needs.deploy.result == 'success' || needs.deploy-wporg.result == 'success') }}
        name: Merge shipped release
        needs: [deploy, deploy-wporg, check-versions]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions: {}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_PR: ${{ needs.check-versions.outputs.pull-request }}
          RELEASE_COMMIT: ${{ needs.check-versions.outputs.commit }}

        steps:

            - name: Merge release PR
              run: |
                pr_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/$RELEASE_PR"
                if ! gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$RELEASE_PR/merge" \
                  -f "sha=$RELEASE_COMMIT" -f merge_method=merge | jq -e '.merged == true' &&
                  ! gh api "repos/$GITHUB_REPOSITORY/pulls/$RELEASE_PR" | jq -e --arg sha "$RELEASE_COMMIT" '.merged and .head.sha == $sha'; then
                  echo "::error::Deployed, merge pending. See $pr_url. Re-run failed jobs after checks pass, or finish through the PR if its head changed."
                  echo "Deployed, merge pending. Review $pr_url." >> "$GITHUB_STEP_SUMMARY"
                  exit 1
                fi

    update_translations:
        if: ${{ fromJSON(needs.check-versions.outputs.config).release.target == 'woocommerce.com' }}
        name: Update Translations
        needs: [ release, deploy, check-versions ]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        env:
          PLUGIN_SLUG: ${{ fromJSON(needs.check-versions.outputs.config).slug }}
          RELEASE_VERSION: ${{ needs.check-versions.outputs.release_version }}

        steps:

            - name: Load release tools
              id: tools
              uses: $/actions/plugin-release-tools

            - name: Update translations
              env:
                RELEASE_TOOLS: ${{ steps.tools.outputs.directory }}
                SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
                SLACK_CHANNEL: ${{ inputs.slack-channel }}
              run: bash "$RELEASE_TOOLS/update_translations.sh"

    roll-milestone:
        if: ${{ !failure() && !cancelled() && (needs.deploy.result == 'success' || needs.deploy-wporg.result == 'success') }}
        name: Roll over milestone
        needs: [ deploy, deploy-wporg, check-versions ]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
          issues: write
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.check-versions.outputs.release_version }}

        steps:

            - name: Close released milestone
              run: |
                MILESTONE_NUMBER=$(gh api --paginate "repos/${{ github.repository }}/milestones?state=open&per_page=100" \
                  --jq ".[] | select(.title == \"${RELEASE_VERSION}\") | .number")

                if [[ -n "$MILESTONE_NUMBER" ]]; then
                  gh api -X PATCH "repos/${{ github.repository }}/milestones/${MILESTONE_NUMBER}" -f state=closed > /dev/null
                  echo "Closed milestone ${RELEASE_VERSION} (#${MILESTONE_NUMBER})."
                else
                  echo "No open milestone titled '${RELEASE_VERSION}' found, nothing to close."
                fi

    handle-success:
        if: ${{ !failure() && !cancelled() && needs.merge-release.result == 'success' }}
        needs: [ deploy, deploy-wporg, merge-release, check-versions ]
        name: Handle success
        runs-on: ubuntu-latest
        timeout-minutes: 5
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RELEASE_VERSION: ${{ needs.check-versions.outputs.release_version }}
        steps:
          - uses: $/actions/notify-slack
            with:
                slack-channel: ${{ inputs.slack-channel }}
                status: success
                message: "<{{{workflowUrl}}}|_{{workflow}}_> with run ID <{{workflowRunUrl}}|{{runId}}> for ${{ github.repository }} *v${{ env.RELEASE_VERSION }}* completed."

    handle-cancelled:
        if: ${{ cancelled() && inputs.deploy == 'plugin' && needs.check-versions.outputs.release_version != '' }}
        needs: [ deploy, deploy-wporg, merge-release, check-versions ]
        name: Handle cancellation
        runs-on: ubuntu-latest
        timeout-minutes: 5
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RELEASE_VERSION: ${{ needs.check-versions.outputs.release_version }}
        steps:
          - uses: $/actions/notify-slack
            with:
                slack-channel: ${{ inputs.slack-channel }}
                status: cancelled
                message: "<{{{workflowUrl}}}|_{{workflow}}_> with run ID <{{workflowRunUrl}}|{{runId}}> for ${{ github.repository }} *v${{ env.RELEASE_VERSION }}* cancelled."

    handle-error:
        if: ${{ failure() && inputs.deploy == 'plugin' && needs.check-versions.outputs.release_version != '' }}
        needs: [ deploy, deploy-wporg, merge-release, check-versions ]
        name: Handle failure
        runs-on: ubuntu-latest
        timeout-minutes: 5
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RELEASE_VERSION: ${{ needs.check-versions.outputs.release_version }}
        steps:
          - uses: $/actions/notify-slack
            with:
                slack-channel: ${{ inputs.slack-channel }}
                status: failure
                message: "<{{{workflowUrl}}}|_{{workflow}}_> with run ID <{{workflowRunUrl}}|{{runId}}> for ${{ github.repository }} *v${{ env.RELEASE_VERSION }}* failed."
