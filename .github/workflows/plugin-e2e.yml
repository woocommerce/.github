name: Acceptance tests with Docker

# Playwright on wp-env against the verified production ZIP, through the plugin's bin/e2e.sh; one
# job per project in config.woo.e2e.projects. Trusted runs download the config.woo.privatePlugins
# entries with the e2e suite before checkout; bin/e2e.sh prepare gets them in
# $WOO_PRIVATE_PLUGIN_ZIPS_DIR and $WOO_PRIVATE_PLUGINS_DIR, never the token.
#
#   e2e-tests:
#     needs: build
#     permissions:
#       contents: read
#       actions: read
#     uses: woocommerce/.github/.github/workflows/plugin-e2e.yml@<commit SHA>
#     with:
#       artifact-id: ${{ needs.build.outputs.artifact-id }}
#       source-sha: ${{ needs.build.outputs.source-sha }}
#       sha256: ${{ needs.build.outputs.sha256 }}
#     secrets:
#       ORG_DOWNLOADS: ${{ secrets.ORG_DOWNLOADS }}

on:
  workflow_call:
    secrets:
      ORG_DOWNLOADS:
        required: false
    inputs:
      # Optional normalized config.woo from github.sha, provided by the PR CI planner.
      event-config:
        type: string
        default: ''
      checkout-ref:
        type: string
      artifact-id:
        type: string
        required: true
      source-sha:
        type: string
        required: true
      sha256:
        type: string
        required: true
      # Empty keeps the .wp-env.test.json versions; `latest`, `nightly` or a release tag otherwise.
      wc-version:
        type: string
        default: ''
      wp-version:
        type: string
        default: ''
      php-version:
        type: string
        default: ''
      # Private plugins (config.woo.e2e.privatePlugins) are downloaded only for trusted
      # callers; specs tagged @integration are skipped otherwise.
      trusted-plugins:
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  config:
    name: Read plugin metadata
    if: inputs.event-config == '' || inputs.checkout-ref != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      json: ${{ steps.config.outputs.json }}
    steps:
      - name: Read config.woo
        id: config
        uses: $/actions/read-plugin-config
        with:
          ref: ${{ inputs.checkout-ref }}

  e2e-tests:
    name: Acceptance${{ matrix.test_mode != '' && format(' ({0})', matrix.test_mode) || '' }}
    needs: config
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.config.result == 'skipped' && inputs.event-config || needs.config.outputs.json).e2e.timeoutMinutes }}

    strategy:
      fail-fast: false
      matrix:
        # config.woo.e2e.projects: Playwright projects, one job each ("" runs every project in one job).
        test_mode: ${{ fromJSON(needs.config.result == 'skipped' && inputs.event-config || needs.config.outputs.json).e2e.projects }}

    env:
      WP_VERSION: ${{ inputs.wp-version }}
      WC_VERSION: ${{ inputs.wc-version }}
      PHP_VERSION: ${{ inputs.php-version }}
      RUN_INTEGRATION_TESTS: ${{ (inputs.trusted-plugins || !fromJSON(needs.config.result == 'skipped' && inputs.event-config || needs.config.outputs.json).e2e.privatePlugins) && '1' || '0' }}
      TEST_MODE: ${{ matrix.test_mode }}

    steps:

      # An e2e entry in config.woo.privatePlugins turns e2e.privatePlugins on. Set on its own, it is
      # the old setup, whose bin/hooks/e2e-prepare.sh downloaded with ORG_DOWNLOADS.
      - name: Check the E2E private plugins
        if: ${{ inputs.trusted-plugins && fromJSON(needs.config.result == 'skipped' && inputs.event-config || needs.config.outputs.json).e2e.privatePlugins }}
        env:
          PLUGINS: ${{ toJSON(fromJSON(needs.config.result == 'skipped' && inputs.event-config || needs.config.outputs.json).privatePlugins) }}
        run: |
          jq -e 'any(.[]; .suites | index("e2e"))' <<< "$PLUGINS" > /dev/null || {
            echo "::error::config.woo.e2e.privatePlugins is set, but no config.woo.privatePlugins entry lists the e2e suite. bin/e2e.sh prepare no longer gets ORG_DOWNLOADS: list the plugins it needs there, and read them from \$WOO_PRIVATE_PLUGIN_ZIPS_DIR or \$WOO_PRIVATE_PLUGINS_DIR."
            exit 1
          }

      # Before checkout, so the token never reaches a step that runs repository code.
      - name: Download private plugins
        if: ${{ inputs.trusted-plugins && fromJSON(needs.config.result == 'skipped' && inputs.event-config || needs.config.outputs.json).e2e.privatePlugins }}
        uses: $/actions/download-private-plugins
        with:
          token: ${{ secrets.ORG_DOWNLOADS }}
          suite: e2e
          plugins: ${{ toJSON(fromJSON(needs.config.result == 'skipped' && inputs.event-config || needs.config.outputs.json).privatePlugins) }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref }}
          persist-credentials: false

      - name: Set up Node.js and the pnpm store cache
        uses: $/actions/setup-plugin-env
        with:
          node: true
          node-cache: ${{ inputs.checkout-ref == '' }}

      - name: Read the checked-out commit
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify the production ZIP
        id: candidate
        uses: $/actions/verify-candidate-zip
        with:
          artifact-id: ${{ inputs.artifact-id }}
          source-sha: ${{ inputs.source-sha }}
          expected-source-sha: ${{ steps.head.outputs.sha }}
          sha256: ${{ inputs.sha256 }}
          zip-name: ${{ fromJSON(needs.config.result == 'skipped' && inputs.event-config || needs.config.outputs.json).slug }}.zip

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Environment
        env:
          E2E_PLUGIN_ZIP: ${{ steps.candidate.outputs.zip }}
        # With no ZIP path, `prepare` builds a ZIP from source; require the verified one instead.
        run: |
          [[ -n "$E2E_PLUGIN_ZIP" && -f "$E2E_PLUGIN_ZIP" ]] || { echo "::error::verify-candidate-zip returned no ZIP."; exit 1; }
          # Older runners read PHP_VERSION. Newer runners need an explicit, nonempty E2E override.
          if [[ -n "$PHP_VERSION" ]]; then
            export E2E_PHP_VERSION="$PHP_VERSION"
          fi
          bash ./bin/e2e.sh prepare

      - name: Run wp-env start
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
        with:
          timeout_minutes: 5
          max_attempts: 3
          command: bash ./bin/e2e.sh start

      - name: Seed the tests site
        run: pnpm run env:test:e2e:seed

      - name: Report installed versions
        shell: bash
        run: |
          if versions=$(pnpm --silent run wp-env:e2e run cli wp eval 'printf("wp-env versions: WordPress %s, WooCommerce %s, PHP %s%s", $GLOBALS["wp_version"], defined("WC_VERSION") ? WC_VERSION : "unavailable", PHP_VERSION, PHP_EOL);' | grep -m1 -E '^wp-env versions: WordPress [0-9][A-Za-z0-9.+-]*, WooCommerce ([0-9][A-Za-z0-9.+-]*|unavailable), PHP [0-9][A-Za-z0-9.+-]*$'); then
            printf '%s\n' "${versions#wp-env versions: }" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            printf 'Installed versions were unavailable.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{ print $2 }')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: inputs.checkout-ref == '' && github.event_name != 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Restore Playwright browsers
        if: inputs.checkout-ref == '' && github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        run: pnpm run test:e2e:install --with-deps

      - name: Run acceptance tests
        id: acceptance
        run: pnpm run test:e2e ${TEST_MODE:+--project "$TEST_MODE"}

      - name: Upload test artifacts
        if: ${{ !cancelled() && steps.acceptance.outcome != 'skipped' && steps.acceptance.outcome != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: acceptance-test-artifacts-${{ strategy.job-index }}
          # Keep the Playwright login state (storageState files) out of the artifact.
          path: |
            tests/e2e/test-results/
            !tests/e2e/test-results/storage*
            tests/_output/e2e-debug.log
