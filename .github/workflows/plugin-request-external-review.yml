name: Request team review for external PRs

# Requests a review from the maintaining team when someone outside it opens a pull request, or marks
# it ready. It never checks out or runs code from the pull request. The caller keeps the
# pull_request_target trigger. API calls authenticate with REVIEW_TOKEN.
#
#   request-review:
#     uses: woocommerce/.github/.github/workflows/plugin-request-external-review.yml@<commit SHA>
#     with:
#       team: my-team
#     secrets:
#       REVIEW_TOKEN: ${{ secrets.REVIEW_TOKEN }}

on:
  workflow_call:
    inputs:
      # The team slug in the repository's organization.
      team:
        type: string
        required: true
    secrets:
      # A token that can read team membership and request team reviewers.
      REVIEW_TOKEN:
        required: true

permissions: {}

jobs:
  request-review:
    name: Request review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # This workflow runs against the base branch and must never check out or
      # execute code from the pull request head.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REVIEW_TEAM: ${{ inputs.team }}
        with:
          github-token: ${{ secrets.REVIEW_TOKEN }}
          script: |
            const org  = context.repo.owner;
            const team = process.env.REVIEW_TEAM;
            const pr   = context.payload.pull_request;
            const user = pr.user.login;

            // botwoo opens the release pull requests. GitHub reports it as a
            // regular user, so the Bot type check alone does not catch it.
            if ( pr.user.type === 'Bot' || user === 'botwoo' ) {
              core.info( `${ user } is a bot, skipping.` );
              return;
            }

            let isMember = false;

            try {
              const { data } = await github.rest.teams.getMembershipForUserInOrg( {
                org,
                team_slug: team,
                username: user,
              } );
              isMember = 'active' === data.state;
            } catch ( error ) {
              // A non-member returns 404. Anything else means the membership
              // lookup itself failed, so fail loudly rather than mistaking the
              // author for an outsider.
              if ( 404 !== error.status ) {
                throw error;
              }
            }

            if ( isMember ) {
              core.info( `${ user } is on @${ org }/${ team }, skipping.` );
              return;
            }

            const { data: requested } = await github.rest.pulls.listRequestedReviewers( {
              ...context.repo,
              pull_number: pr.number,
            } );

            if ( requested.teams.some( ( t ) => t.slug === team ) ) {
              core.info( `@${ org }/${ team } is already requested, skipping.` );
              return;
            }

            await github.rest.pulls.requestReviewers( {
              ...context.repo,
              pull_number: pr.number,
              team_reviewers: [ team ],
            } );

            core.info( `Requested a review from @${ org }/${ team } for external author ${ user }.` );
