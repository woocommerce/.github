name: Validate shared PR scripts

on:
  pull_request:
    paths:
      - composer.json
      - README.md
      - .github/workflows/plugin-pr-ci.yml
      - .github/workflows/plugin-build-zip.yml
      - .github/workflows/plugin-cron-ci.yml
      - .github/workflows/plugin-cron-qit.yml
      - .github/workflows/plugin-e2e.yml
      - .github/workflows/plugin-js-lint.yml
      - .github/workflows/plugin-phpunit.yml
      - .github/workflows/plugin-qit.yml
      - .github/workflows/plugin-release-smoke-test.yml
      - .github/workflows/plugin-release-start.yml
      - .github/workflows/plugin-release.yml
      - .github/workflows/validate-shared-pr-scripts.yml
      - actions/capture-qit-runtime/**
      - actions/check-changelog/**
      - actions/check-version/**
      - actions/notify-slack/**
      - actions/plugin-release-tools/**
      - actions/qit-runtime-versions/**
      - actions/read-plugin-config/**
      - actions/read-pr-versions/**
      - tests/pr-validation.sh
      - tests/qit-runtime-versions.py
      - tests/release-tools.sh

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/actions/read-pr-versions
        id: versions
      - name: Verify version outputs
        env:
          WC_VERSION: ${{ steps.versions.outputs.WC_VERSION }}
          WP_VERSION: ${{ steps.versions.outputs.WP_VERSION }}
          PHP_VERSION: ${{ steps.versions.outputs.PHP_VERSION }}
        run: |
          subject=$(git -C pr-head show -s --format=%s)
          php_expected=$(node actions/read-pr-versions/parse-commit-message-args.js "$subject" php-version __default__)
          wp_expected=$(node actions/read-pr-versions/parse-commit-message-args.js "$subject" wp-version __default__)
          wc_expected=$(node actions/read-pr-versions/parse-commit-message-args.js "$subject" wc-version __default__)
          test "$PHP_VERSION" = "${php_expected%__default__}"
          test "$WP_VERSION" = "${wp_expected%__default__}"
          test "$WC_VERSION" = "${wc_expected%__default__}"
      - name: Test the shared validators
        run: bash tests/pr-validation.sh
      - name: Test QIT version reporting
        run: python3 tests/qit-runtime-versions.py
      - name: Skip Slack with a blank channel
        uses: $/actions/notify-slack
        env:
          SLACK_WEBHOOK_URL: not-a-webhook-url
        with:
          slack-channel: '   '
          status: success
          message: This test must skip Slack.
      - name: Attempt delivery with an explicit channel
        id: slack-delivery
        uses: $/actions/notify-slack
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: not-a-webhook-url
        with:
          slack-channel: '#ci-test'
          status: success
          message: This test must attempt delivery.
      - name: Verify the webhook was attempted
        env:
          SLACK_OUTCOME: ${{ steps.slack-delivery.outcome }}
        run: test "$SLACK_OUTCOME" = failure
      - name: Prepare a release changelog fixture
        run: |
          mkdir -p changelog vendor/bin
          printf '{}\n' > package.json
          printf 'Significance: patch\nType: fix\n\nOne line.\n' > changelog/entry
          cat > vendor/bin/changelogger <<'PHP'
          <?php
          if ( ! in_array( 'changelog/entry', $argv, true ) ) {
              exit( 1 );
          }
          file_put_contents( 'validated-changelog', '' );
          PHP
          chmod +x vendor/bin/changelogger
      - uses: $/actions/check-changelog
        with:
          all: 'true'
      - name: Verify all-mode validation ran
        run: test -f validated-changelog

  validate-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare extension metadata without its own reader
        run: |
          cat > package.json <<'JSON'
          {
            "name": "example-extension",
            "version": "1.0.0",
            "config": {
              "woo": {
                "zip": { "phpCompatibility": { "testVersion": "7.4-8.5" } },
                "phpunit": {
                  "phpInput": "replace",
                  "legs": [{ "php": "7.4", "wp": "minimum", "wc": "minimum" }]
                },
                "integration": {
                  "legs": [{ "php": "8.4", "wp": "previous", "wc": "latest", "script": "test:php:integration" }]
                }
              }
            }
          }
          JSON
          printf '<?php\n/**\n * Requires at least: 6.8\n * WC requires at least: 10.4\n */\n' > example-extension.php
      - name: Read plugin metadata
        id: config
        uses: $/actions/read-plugin-config
        with:
          checkout: 'false'
      - name: Verify config and PHPUnit legs
        env:
          CONFIG: ${{ steps.config.outputs.json }}
          CONFIG_READER: ${{ steps.config.outputs.reader }}
        run: |
          jq -e '.slug == "example-extension" and .zip.phpCompatibility.testVersion == "7.4-8.5"' <<< "$CONFIG"
          matrix=$(bash "$CONFIG_READER" --phpunit-matrix)
          jq -e 'length == 1 and .[0].php == "7.4" and .[0].wp == "6.8" and .[0].wc == "10.4.0"' <<< "$matrix"
          matrix=$(SUITE=integration PREVIOUS_WP=6.9 REQUESTED_WC=11.2.0 REQUESTED_PHP=8.3 bash "$CONFIG_READER" --phpunit-matrix)
          jq -e 'length == 1 and .[0].php == "8.3" and .[0].wp == "6.9" and .[0].wc == "11.2.0" and .[0].script == "test:php:integration"' <<< "$matrix"

      - name: Load release tools
        id: tools
        uses: $/actions/plugin-release-tools
      - name: Rehearse the release scripts
        env:
          RELEASE_TOOLS: ${{ steps.tools.outputs.directory }}
          CONFIG_READER: ${{ steps.config.outputs.reader }}
        run: |
          command -v svnadmin > /dev/null || { sudo apt-get update && sudo apt-get install -y subversion; }
          bash tests/release-tools.sh "$RELEASE_TOOLS" "$CONFIG_READER"
