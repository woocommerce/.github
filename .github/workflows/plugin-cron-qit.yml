name: Cron QIT

# The plugin's weekly QIT run on the WordPress and WooCommerce release candidates, with the full
# set of QIT tests, and a Slack message with the outcome and resolved core compatibility versions.
# Plugins without config.woo.capabilities.qit skip it. The caller keeps the schedule.
#
#   qit:
#     name: QIT
#     uses: woocommerce/.github/.github/workflows/plugin-cron-qit.yml@<commit SHA>
#     with:
#       slack-channel: '#team-ci'
#     secrets:
#       ORG_PARTNER_USER: ${{ secrets.ORG_PARTNER_USER }}
#       ORG_PARTNER_SECRET: ${{ secrets.ORG_PARTNER_SECRET }}
#       SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

on:
  workflow_call:
    inputs:
      slack-channel:
        description: Slack destination. Leave blank to skip notifications.
        type: string
        required: false
      # Enable the private QIT action from a private WooCommerce repository.
      use-qit-action:
        type: boolean
        default: false
    secrets:
      # QIT partner credentials.
      ORG_PARTNER_USER:
        required: false
      ORG_PARTNER_SECRET:
        required: false
      # Slack webhook for callers that set slack-channel.
      SLACK_WEBHOOK_URL:
        required: false

permissions:
  contents: read

jobs:

    config:
        name: Read plugin metadata
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
          json: ${{ steps.config.outputs.json }}
        steps:
          - name: Read config.woo
            id: config
            uses: $/actions/read-plugin-config

    # Plugins without QIT (config.woo.capabilities.qit false) skip every job below.
    build_project:
        if: ${{ fromJSON(needs.config.outputs.json).capabilities.qit }}
        name: Package
        needs: config
        uses: ./.github/workflows/plugin-build-zip.yml
        with:
          qit-derivative: true

    qit-tests:
        name: QIT
        needs: [config, build_project]
        uses: ./.github/workflows/plugin-qit.yml
        secrets:
          ORG_PARTNER_USER: ${{ secrets.ORG_PARTNER_USER }}
          ORG_PARTNER_SECRET: ${{ secrets.ORG_PARTNER_SECRET }}
        with:
          extension: ${{ fromJSON(needs.config.outputs.json).qit.extension }}
          use-qit-action: ${{ inputs.use-qit-action }}
          record-runtime-versions: true
          plugins: ${{ fromJSON(needs.config.outputs.json).qit.plugins }}
          artifact: 'acceptance-test-zip'
          derivative: ${{ fromJSON(needs.config.outputs.json).qit.derivativeExclude != '' && 'qit-derivative' || '' }}
          timeout-minutes: ${{ fromJSON(needs.config.outputs.json).qit.timeoutMinutes }}
          wp-version: 'nightly'
          wc-version: 'nightly'
          test-activation: ${{ 'true' }}
          test-security: ${{ 'true' }}
          test-phpcompatibility: ${{ 'true' }}
          test-validation: ${{ 'true' }}
          test-phpstan: ${{ 'false' }} # QIT PHPStan uses its own config (no repo bootstrap/baseline); the repo's PHPStan (the shared plugin-phpstan.yml) is the gate.
          test-woo-api: ${{ 'true' }}
          test-woo-e2e: ${{ 'true' }}
          test-malware: ${{ 'true' }}
          test-api-fuzz: ${{ fromJSON(needs.config.outputs.json).qit.apiFuzz && 'true' || 'false' }}

    notify:
        if: ${{ !cancelled() && (failure() || needs.qit-tests.result == 'success') }}
        needs: qit-tests
        name: Notify Slack
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions: {}
        env:
            SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        steps:
            - name: Download QIT results
              id: results
              if: ${{ needs.qit-tests.result != 'skipped' }}
              continue-on-error: true
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
              with:
                  name: qit-results
                  path: qit-results
            - name: Read resolved runtime versions
              id: versions
              if: steps.results.outcome == 'success'
              continue-on-error: true
              uses: $/actions/qit-runtime-versions
              with:
                  results-directory: qit-results
            - uses: $/actions/notify-slack
              with:
                  slack-channel: ${{ inputs.slack-channel }}
                  status: ${{ needs.qit-tests.result == 'success' && 'success' || 'failure' }}
                  message: >-
                    Scheduled workflow <{{workflowUrl}}|{{workflow}}> with run ID <{{workflowRunUrl}}|{{runId}}>
                    ${{ needs.qit-tests.result == 'success' && 'passed.' || 'failed. You can find the results in the artifacts section.' }}
                    ${{ steps.versions.outputs.summary && format('QIT runtime versions were {0}.', steps.versions.outputs.summary) || 'QIT runtime versions were unavailable.' }}

    handle-cancelled:
        if: ${{ cancelled() }}
        needs: qit-tests
        name: Handle cancellation
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions: {}
        env:
            SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        steps:
            - uses: $/actions/notify-slack
              with:
                  slack-channel: ${{ inputs.slack-channel }}
                  status: cancelled
                  message: "Scheduled workflow <{{workflowUrl}}|{{workflow}}> with run ID <{{workflowRunUrl}}|{{runId}}> cancelled."
